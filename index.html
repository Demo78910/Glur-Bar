<html lang="th">
<head>

<title>GLUR BAR — Stock & Sales</title>
<style>
:root{--bg:#FFF8F2;--panel:#FFFFFF;--panel2:#FFF0E5;--gold:#F47721;--gold2:#E96512;--text:#302820;--muted:#8A786B;--line:#F0D7C5;--red:#D83B32;--green:#278653}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
.top{padding:20px 16px 14px;background:linear-gradient(130deg,#F47721,#FF914D 75%);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.brand{color:#FFFFFF;font-size:22px;font-weight:800;letter-spacing:2px}
.sub{color:#FFF4EB;font-size:12px;margin-top:2px}
.wrap{max-width:900px;margin:auto;padding:16px 14px 100px}
.page-title{font-size:22px;font-weight:750;margin:4px 0 14px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;min-width:0;box-shadow:0 2px 8px #8C4A1710}
.metric-label{font-size:12px;color:var(--muted)}
.metric{font-size:24px;color:var(--gold2);font-weight:750;margin-top:5px;overflow-wrap:anywhere}
.section-title{font-size:16px;font-weight:700;margin:18px 0 10px}
.muted{color:var(--muted)}
.small{font-size:12px}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:9px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0;flex:1}
.field label{font-size:12px;color:var(--muted)}
input,select{width:100%;min-width:0;border:1px solid var(--line);background:#FFFFFF;color:var(--text);border-radius:9px;padding:11px 10px;outline:none}
input:focus,select:focus{border-color:var(--gold)}
.btn{border:1px solid var(--gold);background:var(--gold);color:#FFFFFF;font-weight:750;border-radius:10px;padding:11px 13px}
.btn.secondary{background:#FFFFFF;color:var(--gold2)}
.btn.danger{border-color:#E8B7B2;background:#FFF0EE;color:#B42318}
.btn.smallbtn{padding:7px 10px;font-size:12px}
.full{width:100%}
.nav{position:fixed;z-index:10;bottom:0;left:0;right:0;display:flex;overflow-x:auto;background:#FFFFFF;border-top:1px solid var(--line);padding:7px max(7px,env(safe-area-inset-right)) calc(7px + env(safe-area-inset-bottom)) max(7px,env(safe-area-inset-left));gap:4px}
.nav button{flex:1;min-width:65px;border:0;background:transparent;color:var(--muted);padding:8px 5px;border-radius:9px;font-size:11px}
.nav button span{display:block;font-size:18px;margin-bottom:3px}
.nav button.active{color:#FFFFFF;background:var(--gold)}
.item{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item-name{font-weight:650;overflow-wrap:anywhere}
.pill{display:inline-block;border:1px solid var(--line);border-radius:20px;padding:3px 8px;font-size:11px;color:var(--muted)}
.warn{color:var(--red)}
.good{color:var(--green)}
.empty{padding:20px 8px;text-align:center;color:var(--muted)}
.hidden{display:none!important}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.formgrid .wide{grid-column:1/-1}
.ingredient-row{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(60px,.8fr) 38px;gap:6px;margin:7px 0}
.ingredient-row input,.ingredient-row select{padding:9px 7px}
.tableline{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.tableline:last-child{border-bottom:0}
.toast{position:fixed;z-index:20;left:50%;bottom:88px;transform:translateX(-50%);background:#FFF0D9;color:#7A3109;padding:10px 16px;border-radius:20px;box-shadow:0 5px 24px #0002;max-width:90%;font-weight:650}
.hint{border-left:3px solid var(--gold);padding:8px 10px;background:#FFF0E5;border-radius:0 8px 8px 0;color:#70401F;font-size:12px;margin:10px 0}
.actions{display:flex;gap:7px;flex-wrap:wrap}
@media(min-width:650px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.wrap{padding-top:22px}.formgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}

.auth-screen{max-width:420px;margin:38px auto;padding:0 12px}
.auth-screen .card{padding:22px}
.auth-screen h2{margin:0 0 7px;font-size:23px}
.auth-screen .stack{margin-top:18px}
.auth-status{font-size:13px;margin:12px 0;color:var(--muted)}
.auth-status.error{color:var(--red)}
.account-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 12px;font-size:12px;color:var(--muted)}

/* GLUR BAR — charcoal & ember compact redesign */
:root{--bg:#0e0d0d;--panel:#1a1716;--panel2:#27201d;--gold:#f47721;--gold2:#ff9b54;--text:#f6eee8;--muted:#b4a69b;--line:#40312a;--red:#ff7567;--green:#65d39a}
body{background:radial-gradient(ellipse at 70% -10%,#3b1d13 0%,transparent 45%),var(--bg);color:var(--text);font-size:14px}
.top{background:linear-gradient(100deg,#21120d,#401e11 60%,#160f0c);padding:15px 18px;border-bottom:1px solid #643a27;box-shadow:0 5px 25px #0005}
.brand{color:#ff9b54;font-size:27px;font-weight:950;letter-spacing:3px;text-shadow:0 2px 15px #f4772140}
.sub{color:#d9a27d;letter-spacing:1.2px;font-size:10px}
.wrap{max-width:1240px;padding:16px 12px 105px}
.page-title{font-size:20px;margin:5px 0 12px;letter-spacing:.2px}
.card{background:linear-gradient(140deg,#211b18,#171514);border-color:var(--line);border-radius:13px;padding:12px;box-shadow:0 5px 24px #0002}
.metric{color:var(--gold2);font-size:22px}
.section-title{font-size:15px;margin:15px 0 9px}
input,select,textarea{background:#171514;color:var(--text);border:1px solid #504039;border-radius:9px;padding:10px}
input::placeholder,textarea::placeholder{color:#89776d}
.btn{background:linear-gradient(120deg,#e96a1d,#f99044);border-color:#ed7a33;color:#1a100b;padding:9px 12px}
.btn.secondary{background:#29211e;color:#ffc096;border-color:#755039}
.btn.danger{background:#35201e;color:#ff9588;border-color:#7d3b34}
.nav{background:#181413;border-color:#473127;box-shadow:0 -6px 25px #0007}
.nav button{color:#c0a99c;min-width:62px}

.item{padding:9px 0;border-color:#3c2f29}
.item-name{font-size:13px}
.pill{border-color:#594036;color:#e0bca5}

.toast{background:#f9b27a;color:#251208}
.account-bar{padding:5px 0 9px}
.compact-toolbar{display:flex;gap:7px;align-items:center;margin-bottom:9px}
.compact-toolbar input{flex:1}
.chip-row{display:flex;gap:6px;overflow-x:auto;padding:2px 0 9px;scrollbar-width:thin}
.chip{white-space:nowrap;border:1px solid #544037;background:#241c19;color:#d8c0b0;border-radius:8px;padding:7px 10px;font-size:12px}
.chip.active{background:#d86520;border-color:#f18c4c;color:#fff}
.stock-entry{width:100%;display:flex;align-items:center;justify-content:space-between;gap:9px;border:0;border-bottom:1px solid #3c2f29;background:transparent;color:inherit;padding:11px 2px;text-align:left}
.stock-entry:last-child{border-bottom:0}
.stock-entry:hover,.recipe-tile:hover{background:#2a201c}
.stock-entry .right{text-align:right;white-space:nowrap}
.status-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:5px}
.status-dot.low{background:#ff8d42}.status-dot.out{background:var(--red)}
.back-link{border:0;background:none;color:#ffa266;padding:4px 0 12px;font-weight:700}
.detail-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.detail-head h2{margin:0;font-size:21px}
.detail-value{font-size:29px;font-weight:800;color:#ff9a53}
.detail-sub{font-size:12px;color:var(--muted)}
.recipe-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.recipe-tile{border:1px solid #463126;border-radius:13px;overflow:hidden;background:#211916;color:var(--text);text-align:left;padding:0}
.recipe-cover{height:115px;background:linear-gradient(135deg,#683018,#24140e);display:flex;align-items:center;justify-content:center;font-size:36px;overflow:hidden}
.recipe-cover img{width:100%;height:100%;object-fit:cover}
.recipe-info{padding:9px}.recipe-info strong{display:block;font-size:13px}.recipe-info small{color:#c9a994}
.kpi-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin:12px 0}
.kpi{padding:10px 8px;border:1px solid #48332a;background:#261e1a;border-radius:10px;min-width:0}
.kpi small{display:block;color:#bda99b;font-size:10px}.kpi strong{font-size:16px;overflow-wrap:anywhere}
.image-slot{height:200px;background:linear-gradient(135deg,#5b2b19,#1c1411);border-radius:12px;display:flex;align-items:center;justify-content:center;color:#e4b08a;overflow:hidden}
.image-slot img{width:100%;height:100%;object-fit:cover}
@media(min-width:850px){.wrap{padding-left:190px;padding-right:22px}.nav{top:92px;bottom:0;right:auto;width:172px;flex-direction:column;justify-content:flex-start;overflow-y:auto;padding:15px 9px}.nav button{display:flex;align-items:center;text-align:left;font-size:13px;gap:9px;padding:12px}.nav button span{font-size:19px;margin:0}.recipe-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.recipe-cover{height:155px}}

/* Persistent user session controls — outside #app so page rerenders cannot remove them */
.glur-account{position:sticky;top:0;z-index:12;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px max(14px,calc((100vw - 1210px)/2));background:#1d1714;border-bottom:1px solid #5b3a29;color:#f7e5d6;font-size:12px}
.glur-account #glurAccountText{overflow-wrap:anywhere;min-width:0}
.glur-account .btn{flex-shrink:0}
@media(max-width:600px){.glur-account{padding:8px 12px}.glur-account .btn{padding:7px 10px}}

<body>
<header class="top"><div class="brand">GLUR <span style="font-size:12px;letter-spacing:5px">BAR</span></div><div class="sub">STOCK · RECIPES · SALES · REPORTS</div></header>
<div id="glurAccount" class="glur-account hidden" aria-label="ข้อมูลบัญชีผู้ใช้"><span id="glurAccountText">กำลังตรวจสอบสิทธิ์…</span><button type="button" id="glurLogout" class="btn secondary smallbtn">ออกจากระบบ</button></div>
<main class="wrap" id="app"></main>
<nav class="nav" id="nav">
<button data-page="dashboard" class="active"><span>⌂</span>ภาพรวม</button><button data-page="stock"><span>▤</span>สต๊อก</button><button data-page="recipes"><span>✧</span>สูตร</button><button data-page="sales"><span>＋</span>ขาย</button><button data-page="receiving"><span>⇩</span>รับเข้า</button><button data-page="costs"><span>฿</span>ค่าใช้จ่าย</button><button data-page="reports"><span>▥</span>รายงาน</button><button data-page="settings"><span>⚙</span>สำรอง</button>
</nav>
<div id="toast" class="toast hidden" role="status"></div>
<script>
const SUPABASE_URL =
  "https://zkicghxgfuybwfnwxlfg.supabase.co";
const SUPABASE_KEY =
  "sb_publishable_rbvnWD6TtzMqjxhWi49ZjQ_IggouNp2";
const glurSupabase = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);
'use strict';
const KEY='glurBarApp_v1';
const blank=()=>({stock:[],recipes:[],sales:[],receipts:[],expenses:[]});
let db=loadDB(),page='dashboard';
const GLUR_SHOP_ID='bdd83213-8d38-42d7-bd35-835506dc25ac';
let cloudStock=[],cloudReady=false,cloudError='';

function loadDB(){try{return {...blank(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){return blank()}}
function saveDB(){localStorage.setItem(KEY,JSON.stringify(db))}
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(n){return new Intl.NumberFormat('th-TH',{style:'currency',currency:'THB',maximumFractionDigits:2}).format(Number(n)||0)}
function num(v){const n=Number(v);return Number.isFinite(n)?n:0}
function dateNow(){return new Date().toISOString().slice(0,10)}
function monthNow(){return dateNow().slice(0,7)}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.add('hidden'),2400)}
function setPage(p){if(!currentUser)return;page=p;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('button[data-page]');if(b)setPage(b.dataset.page)});
function stockById(sid){return db.stock.find(s=>s.id===sid)}
function recipeCost(r){return (r.ingredients||[]).reduce((sum,x)=>{const s=stockById(x.stockId);return sum+(s?num(x.qty)*num(s.cost):0)},0)}
function sum(arr,fn){return arr.reduce((a,x)=>a+fn(x),0)}
function monthSales(m){return db.sales.filter(s=>(s.date||'').slice(0,7)===m)}
function monthExpenses(m){return db.expenses.filter(x=>(x.date||'').slice(0,7)===m)}
function shell(title,body){document.getElementById('app').innerHTML=`<div class="page-title">${title}</div>${body}`}
function metric(label,value,sub=''){return `<div class="card"><div class="metric-label">${label}</div><div class="metric">${value}</div>${sub?`<div class="small muted">${sub}</div>`:''}</div>`}
function empty(msg){return `<div class="empty">${msg}</div>`}
function render(){if(!currentUser)return;const f={dashboard:renderDashboard,stock:renderStock,recipes:renderRecipes,sales:renderSales,receiving:renderReceiving,costs:renderCosts,reports:renderReports,settings:renderSettings};(f[page]||renderDashboard)();if(['recipes','sales','receiving'].includes(page)){const app=document.getElementById('app');const hint=document.createElement('div');hint.className='hint';hint.textContent='โหมดดูข้อมูลเดิม: เมนูนี้ยังไม่เชื่อมกับ Supabase จึงปิดการบันทึก/แก้ไขชั่วคราว เพื่อไม่ให้สต๊อกออนไลน์คลาดเคลื่อน';app.insertBefore(hint,app.children[1]||null);app.querySelectorAll('form input,form select,form button,.actions button').forEach(el=>el.disabled=true);}}
function renderDashboard(){const m=monthNow(),ss=monthSales(m),rev=sum(ss,s=>num(s.revenue)),cogs=sum(ss,s=>num(s.cost)),exp=sum(monthExpenses(m),x=>num(x.amount));shell('ภาพรวมร้าน',`<div class="muted small">${m} · สรุปข้อมูลเดือนปัจจุบัน</div><div class="grid" style="margin-top:12px">${metric('ยอดขายเดือนนี้',money(rev))}${metric('ต้นทุนสินค้าที่ขาย',money(cogs))}${metric('ค่าใช้จ่ายอื่น',money(exp))}${metric('กำไรหลังหักค่าใช้จ่าย',money(rev-cogs-exp))}</div><div class="section-title">สต๊อกใกล้หมด</div><div class="card">${(()=>{const low=cloudStock.filter(s=>num(s.quantity)<=num(s.min_quantity)).map(s=>({name:s.name,qty:s.quantity,low:s.min_quantity,unit:s.unit}));return low.length?low.map(s=>`<div class="item"><div><div class="item-name">${esc(s.name)}</div><div class="small muted">เหลือ ${num(s.qty)} ${esc(s.unit)}</div></div><span class="pill warn">ใกล้หมด</span></div>`).join(''):empty('ยังไม่มีรายการสต๊อกที่ต่ำกว่าระดับแจ้งเตือน')})()}</div><div class="section-title">ทางลัด</div><div class="grid"><button class="btn secondary" onclick="setPage('stock')">＋ เพิ่มวัตถุดิบ</button><button class="btn secondary" onclick="setPage('recipes')">✧ สร้างสูตร</button><button class="btn secondary" onclick="setPage('sales')">＋ บันทึกยอดขาย</button><button class="btn secondary" onclick="setPage('receiving')">⇩ รับของเข้า</button></div><div class="hint">สต๊อกแสดงข้อมูลออนไลน์จาก Supabase · ยอดขาย สูตร และรายงานยังเป็นข้อมูลเดิมในเบราว์เซอร์ ยังไม่ใช่ยอดรวมของทุกเครื่อง</div>`)}
function renderStock(){
 if(!cloudReady){shell('สต๊อกออนไลน์',`<div class="card">${cloudError?`<div class="warn">${esc(cloudError)}</div><button class="btn" onclick="loadCloudStock()">ลองใหม่</button>`:'กำลังโหลดสต๊อกจาก Supabase…'}</div>`);return}
 shell('สต๊อกออนไลน์ · GLUR BAR',`<div class="hint">ข้อมูลสต๊อกในหน้านี้บันทึกบน Supabase และใช้ร่วมกันทุกอุปกรณ์ที่มีสิทธิ์เข้าถึงร้าน · ข้อมูลสต๊อกเดิมในเบราว์เซอร์ไม่ได้ถูกนำเข้าอัตโนมัติ</div><div class="card"><div class="row between"><strong>รายการวัตถุดิบ (${cloudStock.length})</strong><button class="btn secondary smallbtn" onclick="loadCloudStock()">↻ รีเฟรช</button></div></div><div class="card"><div class="section-title" style="margin-top:0">เพิ่มวัตถุดิบออนไลน์</div><form id="cloudStockForm" class="formgrid"><div class="field wide"><label>ชื่อวัตถุดิบ</label><input name="name" required maxlength="150" placeholder="เช่น Tanqueray Gin"></div><div class="field"><label>จำนวนคงเหลือ</label><input name="quantity" type="number" min="0" step="any" value="0" required></div><div class="field"><label>หน่วย</label><select name="unit"><option>ml</option><option>g</option><option>ชิ้น</option><option>ขวด</option><option>ถุง</option><option>หน่วย</option></select></div><div class="field"><label>ต้นทุนต่อหน่วย (บาท)</label><input name="cost_per_unit" type="number" min="0" step="any" value="0" required></div><div class="field"><label>แจ้งเตือนเมื่อเหลือ</label><input name="min_quantity" type="number" min="0" step="any" value="0" required></div><div class="wide"><button class="btn full" type="submit">＋ บันทึกบน Supabase</button></div></form></div><div class="section-title">รายการในคลาวด์</div><div class="card">${cloudStock.length?cloudStock.map(x=>`<div class="item"><div style="min-width:0"><div class="item-name">${esc(x.name)}</div><div class="small muted">ต้นทุน ${money(x.cost_per_unit)}/${esc(x.unit)} · แจ้งเตือน ${num(x.min_quantity)} ${esc(x.unit)}</div><div class="${num(x.quantity)<=num(x.min_quantity)?'warn':'good'}">เหลือ ${num(x.quantity)} ${esc(x.unit)}</div></div><div class="actions"><button class="btn secondary smallbtn" onclick="editCloudStock('${x.id}')">แก้ไข</button><button class="btn danger smallbtn" onclick="deleteCloudStock('${x.id}')">ลบ</button></div></div>`).join(''):empty('ยังไม่มีวัตถุดิบออนไลน์')}</div>`);
 document.getElementById('cloudStockForm').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button[type=submit]');b.disabled=true;const d=new FormData(e.target);const payload={shop_id:GLUR_SHOP_ID,name:String(d.get('name')||'').trim(),unit:String(d.get('unit')),quantity:Number(d.get('quantity')),cost_per_unit:Number(d.get('cost_per_unit')),min_quantity:Number(d.get('min_quantity')),category:String(d.get('category')),subcategory:String(d.get('subcategory'))};if(!payload.name||[payload.quantity,payload.cost_per_unit,payload.min_quantity].some(x=>!Number.isFinite(x)||x<0)){toast('กรุณาตรวจสอบข้อมูล');b.disabled=false;return}const {error}=await glurSupabase.from('glur_stock').insert(payload);if(error){toast('บันทึกไม่สำเร็จ: '+error.message);b.disabled=false;return}toast('บันทึกสต๊อกออนไลน์แล้ว');await loadCloudStock()};
}
async function loadCloudStock(){cloudError='';cloudReady=false;if(page==='stock')renderStock();const {data,error}=await glurSupabase.from('glur_stock').select('id,shop_id,name,unit,quantity,cost_per_unit,min_quantity,category,subcategory,created_at').eq('shop_id',GLUR_SHOP_ID).order('created_at',{ascending:true});if(error){cloudError='โหลดสต๊อกไม่ได้: '+error.message;cloudReady=false}else{cloudStock=data||[];cloudReady=true}if(currentUser){if(page==='stock')renderStock();else if(page==='dashboard')renderDashboard()}}
async function editCloudStock(sid){const x=cloudStock.find(y=>y.id===sid);if(!x)return;const name=prompt('ชื่อวัตถุดิบ',x.name);if(name===null)return;const quantity=prompt('จำนวนคงเหลือ ('+x.unit+')',x.quantity);if(quantity===null)return;const cost=prompt('ต้นทุนต่อ '+x.unit+' (บาท)',x.cost_per_unit);if(cost===null)return;const low=prompt('แจ้งเตือนเมื่อเหลือ',x.min_quantity);if(low===null)return;const nums=[quantity,cost,low].map(Number);if(!name.trim()||nums.some(v=>!Number.isFinite(v)||v<0)){toast('ข้อมูลไม่ถูกต้อง');return}const {error}=await glurSupabase.from('glur_stock').update({name:name.trim(),quantity:nums[0],cost_per_unit:nums[1],min_quantity:nums[2]}).eq('id',sid).eq('shop_id',GLUR_SHOP_ID).select('id');if(error){toast('แก้ไขไม่สำเร็จ: '+error.message);return}toast('แก้ไขออนไลน์แล้ว');await loadCloudStock()}

function renderRecipes(){shell('สูตรเครื่องดื่ม',`<div class="card"><div class="section-title" style="margin-top:0">สร้างสูตรใหม่</div>${db.stock.length?'':`<div class="hint">ต้องเพิ่มวัตถุดิบในเมนูสต๊อกก่อน จึงจะสร้างสูตรได้</div>`}<form id="recipeForm"><div class="field"><label>ชื่อเมนู</label><input name="name" required placeholder="เช่น Gin & Tonic" /></div><div class="formgrid" style="margin-top:9px"><div class="field"><label>ราคาขาย (บาท)</label><input name="price" type="number" min="0" step="any" required value="250" /></div><div class="field"><label>คำอธิบาย (ไม่บังคับ)</label><input name="note" placeholder="รสชาติ / แก้ว" /></div></div><div class="section-title">วัตถุดิบในสูตร</div><div id="ingredientRows"></div><button class="btn secondary full" type="button" id="addIngredient">＋ เพิ่มวัตถุดิบในสูตร</button><button class="btn full" style="margin-top:10px" type="submit" ${db.stock.length?'':'disabled'}>บันทึกสูตร</button></form></div><div class="section-title">สูตรที่บันทึกไว้ (${db.recipes.length})</div><div class="card">${db.recipes.length?db.recipes.map(r=>`<div class="item"><div style="min-width:0"><div class="item-name">${esc(r.name)}</div><div class="small muted">ขาย ${money(r.price)} · ต้นทุน ${money(recipeCost(r))}</div><div class="small muted">${(r.ingredients||[]).length} วัตถุดิบ · กำไรขั้นต้น ${money(num(r.price)-recipeCost(r))}</div></div><div class="actions"><button class="btn secondary smallbtn" onclick="editRecipe('${r.id}')">แก้ไข</button><button class="btn danger smallbtn" onclick="deleteRecipe('${r.id}')">ลบ</button></div></div>`).join(''):empty('ยังไม่มีสูตร')}</div>`);const rows=document.getElementById('ingredientRows');function addRow(sid='',qty=''){const div=document.createElement('div');div.className='ingredient-row';div.innerHTML=`<select aria-label="วัตถุดิบ"><option value="">เลือกวัตถุดิบ</option>${db.stock.map(s=>`<option value="${s.id}" ${s.id===sid?'selected':''}>${esc(s.name)} (${esc(s.unit)})</option>`).join('')}</select><input aria-label="ปริมาณ" type="number" step="any" min="0" placeholder="ปริมาณ" value="${esc(qty)}"><button type="button" class="btn danger smallbtn" aria-label="ลบแถว">×</button>`;div.querySelector('button').onclick=()=>div.remove();rows.appendChild(div)}addRow();document.getElementById('addIngredient').onclick=()=>addRow();document.getElementById('recipeForm').addEventListener('submit',e=>{e.preventDefault();const d=new FormData(e.target),ingredients=[...rows.children].map(el=>({stockId:el.children[0].value,qty:num(el.children[1].value)})).filter(x=>x.stockId&&x.qty>0);if(!ingredients.length){toast('เพิ่มวัตถุดิบอย่างน้อย 1 รายการ');return}db.recipes.push({id:id(),name:String(d.get('name')).trim(),price:num(d.get('price')),note:String(d.get('note')||''),ingredients});saveDB();toast('บันทึกสูตรแล้ว');renderRecipes()})}
function editRecipe(rid){const r=db.recipes.find(x=>x.id===rid);if(!r)return;const name=prompt('ชื่อเมนู',r.name);if(name===null)return;const price=prompt('ราคาขาย (บาท)',r.price);if(price===null)return;r.name=name.trim()||r.name;r.price=Math.max(0,num(price));saveDB();renderRecipes();toast('แก้ไขชื่อและราคาแล้ว')}

function renderSales(){shell('บันทึกยอดขาย',`<div class="card"><div class="section-title" style="margin-top:0">ขายเมนูจากสูตร</div>${db.recipes.length?'':empty('เพิ่มสูตรเครื่องดื่มก่อนเริ่มบันทึกขาย')}<form id="saleForm" class="stack"><div class="field"><label>เมนู</label><select name="recipe" required>${db.recipes.map(r=>`<option value="${r.id}">${esc(r.name)} — ${money(r.price)}</option>`).join('')}</select></div><div class="formgrid"><div class="field"><label>จำนวนแก้ว</label><input name="qty" type="number" min="1" step="1" value="1" required></div><div class="field"><label>วันที่ขาย</label><input name="date" type="date" value="${dateNow()}" required></div></div><div class="hint">ระบบจะตรวจสต๊อก ตัดวัตถุดิบตามสูตร และบันทึกยอดขายพร้อมต้นทุน ณ วันที่ขาย</div><button class="btn full" type="submit" ${db.recipes.length?'':'disabled'}>บันทึกการขายและตัดสต๊อก</button></form></div><div class="section-title">ประวัติการขายล่าสุด</div><div class="card">${db.sales.length?[...db.sales].reverse().slice(0,30).map(s=>`<div class="item"><div><div class="item-name">${esc(s.name)} × ${s.qty}</div><div class="small muted">${esc(s.date)} · ต้นทุน ${money(s.cost)}</div></div><strong>${money(s.revenue)}</strong></div>`).join(''):empty('ยังไม่มีรายการขาย')}</div>`);document.getElementById('saleForm').addEventListener('submit',e=>{e.preventDefault();const d=new FormData(e.target),r=db.recipes.find(x=>x.id===d.get('recipe')),qty=Math.max(1,Math.floor(num(d.get('qty'))));if(!r)return;for(const ing of r.ingredients){const s=stockById(ing.stockId),need=num(ing.qty)*qty;if(!s||num(s.qty)<need){toast(`สต๊อกไม่พอ: ${s?s.name:'วัตถุดิบถูกลบ'}`);return}}for(const ing of r.ingredients){const s=stockById(ing.stockId);s.qty=Number((num(s.qty)-num(ing.qty)*qty).toFixed(4))}db.sales.push({id:id(),date:d.get('date')||dateNow(),recipeId:r.id,name:r.name,qty,revenue:num(r.price)*qty,cost:recipeCost(r)*qty});saveDB();toast('บันทึกยอดขายและตัดสต๊อกแล้ว');renderSales()})}
function renderReceiving(){shell('รับวัตถุดิบเข้า',`<div class="card"><div class="section-title" style="margin-top:0">บันทึกรับเข้า</div>${db.stock.length?'':empty('เพิ่มวัตถุดิบในเมนูสต๊อกก่อน')}<form id="receiveForm" class="stack"><div class="field"><label>วัตถุดิบ</label><select name="stock" required>${db.stock.map(s=>`<option value="${s.id}">${esc(s.name)} (${esc(s.unit)})</option>`).join('')}</select></div><div class="formgrid"><div class="field"><label>จำนวนที่รับเข้า (หน่วยหลัก)</label><input name="qty" type="number" min="0.0001" step="any" required placeholder="เช่น 700" /></div><div class="field"><label>ราคารวมที่ซื้อ (บาท)</label><input name="cost" type="number" min="0" step="any" required placeholder="เช่น 749" /></div><div class="field"><label>วันที่รับเข้า</label><input name="date" type="date" value="${dateNow()}" required /></div></div><div class="hint">ต้นทุนต่อหน่วยจะคำนวณเป็นค่าเฉลี่ยถ่วงน้ำหนักจากสต๊อกเดิมและของที่รับเข้า</div><button class="btn full" type="submit" ${db.stock.length?'':'disabled'}>บันทึกรับเข้า</button></form></div><div class="section-title">ประวัติรับเข้า</div><div class="card">${db.receipts.length?[...db.receipts].reverse().slice(0,30).map(x=>`<div class="item"><div><div class="item-name">${esc(x.name)} +${x.qty} ${esc(x.unit)}</div><div class="small muted">${esc(x.date)} · ${money(x.cost)} รวม</div></div><strong>${money(x.unitCost)}/${esc(x.unit)}</strong></div>`).join(''):empty('ยังไม่มีรายการรับเข้า')}</div>`);document.getElementById('receiveForm').addEventListener('submit',e=>{e.preventDefault();const d=new FormData(e.target),s=stockById(d.get('stock')),qty=num(d.get('qty')),cost=num(d.get('cost'));if(!s||qty<=0)return;const oldQty=num(s.qty),newQty=oldQty+qty;s.cost=newQty>0?(oldQty*num(s.cost)+cost)/newQty:0;s.qty=newQty;db.receipts.push({id:id(),date:d.get('date')||dateNow(),stockId:s.id,name:s.name,unit:s.unit,qty,cost,unitCost:qty?cost/qty:0});saveDB();toast('รับวัตถุดิบเข้าแล้ว');renderReceiving()})}
function renderCosts(){shell('ค่าใช้จ่าย',`<div class="card"><div class="section-title" style="margin-top:0">เพิ่มค่าใช้จ่าย</div><form id="expenseForm" class="stack"><div class="field"><label>รายการ</label><input name="name" required placeholder="เช่น น้ำแข็ง / ค่าเดินทาง / อุปกรณ์" /></div><div class="formgrid"><div class="field"><label>จำนวนเงิน (บาท)</label><input name="amount" type="number" min="0" step="any" required /></div><div class="field"><label>วันที่</label><input name="date" type="date" value="${dateNow()}" required /></div></div><button class="btn full" type="submit">＋ บันทึกค่าใช้จ่าย</button></form></div><div class="section-title">รายการค่าใช้จ่าย</div><div class="card">${db.expenses.length?[...db.expenses].reverse().map(x=>`<div class="item"><div><div class="item-name">${esc(x.name)}</div><div class="small muted">${esc(x.date)}</div></div><div class="row"><strong>${money(x.amount)}</strong><button class="btn danger smallbtn" onclick="deleteExpense('${x.id}')">ลบ</button></div></div>`).join(''):empty('ยังไม่มีค่าใช้จ่าย')}</div>`);document.getElementById('expenseForm').addEventListener('submit',e=>{e.preventDefault();const d=new FormData(e.target);db.expenses.push({id:id(),name:String(d.get('name')).trim(),amount:num(d.get('amount')),date:d.get('date')||dateNow()});saveDB();toast('บันทึกค่าใช้จ่ายแล้ว');renderCosts()})}
function deleteExpense(eid){if(!confirm('ลบรายการนี้หรือไม่?'))return;db.expenses=db.expenses.filter(x=>x.id!==eid);saveDB();renderCosts()}
function renderReports(){const m=monthNow(),ss=monthSales(m),rev=sum(ss,s=>num(s.revenue)),cogs=sum(ss,s=>num(s.cost)),ex=monthExpenses(m),expenses=sum(ex,x=>num(x.amount));shell('รายงานประจำเดือน',`<div class="card"><div class="field"><label>เลือกเดือน</label><input type="month" id="reportMonth" value="${m}"></div><div id="reportData" style="margin-top:14px"></div><button class="btn secondary full" style="margin-top:12px" id="exportCSV">ส่งออกรายการขาย CSV</button></div><div class="section-title">หมายเหตุการคำนวณ</div><div class="hint">กำไรสุทธิในรายงานนี้ = ยอดขาย − ต้นทุนสูตรของรายการขาย − ค่าใช้จ่ายที่บันทึกไว้ ไม่รวมค่าใช้จ่ายที่ยังไม่ได้บันทึกหรือภาษี</div>`);function update(){const mm=document.getElementById('reportMonth').value, sales=monthSales(mm), exps=monthExpenses(mm),revenue=sum(sales,s=>num(s.revenue)),cost=sum(sales,s=>num(s.cost)),other=sum(exps,x=>num(x.amount));document.getElementById('reportData').innerHTML=`<div class="stack">${[['ยอดขาย',money(revenue)],['ต้นทุนสินค้าที่ขาย',money(cost)],['กำไรขั้นต้น',money(revenue-cost)],['ค่าใช้จ่ายอื่น',money(other)],['กำไรหลังหักค่าใช้จ่าย',money(revenue-cost-other)],['จำนวนรายการขาย',sales.length+' รายการ']].map(([a,b])=>`<div class="tableline"><span class="muted">${a}</span><strong>${b}</strong></div>`).join('')}</div><div class="section-title">ขายดีในเดือนนี้</div>${(()=>{const tally={};sales.forEach(s=>tally[s.name]=(tally[s.name]||0)+num(s.qty));const top=Object.entries(tally).sort((a,b)=>b[1]-a[1]).slice(0,5);return top.length?top.map(([n,q])=>`<div class="tableline"><span>${esc(n)}</span><strong>${q} แก้ว</strong></div>`).join(''):empty('ไม่มีรายการขายในเดือนนี้')})()}`};update();document.getElementById('reportMonth').addEventListener('change',update);document.getElementById('exportCSV').onclick=()=>{const mm=document.getElementById('reportMonth').value,sales=monthSales(mm),rows=[['date','menu','quantity','revenue_THB','cost_THB'],...sales.map(s=>[s.date,s.name,s.qty,s.revenue,s.cost])];const csv='\ufeff'+rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');downloadBlob(csv,`glur-bar-sales-${mm}.csv`,'text/csv;charset=utf-8;') }}
function renderSettings(){shell('สำรองและกู้คืนข้อมูล',`<div class="card"><div class="section-title" style="margin-top:0">ข้อมูลของ GLUR BAR</div><div class="grid">${metric('วัตถุดิบ',db.stock.length+' รายการ')}${metric('สูตร',db.recipes.length+' รายการ')}${metric('ยอดขาย',db.sales.length+' รายการ')}${metric('ค่าใช้จ่าย',db.expenses.length+' รายการ')}</div><div class="hint">ข้อมูลเก็บอยู่ใน localStorage ของเบราว์เซอร์นี้ หากล้างข้อมูลเว็บไซต์ เปลี่ยนเบราว์เซอร์ หรือเครื่องเสีย ข้อมูลอาจหายได้ กรุณาดาวน์โหลดไฟล์สำรองเป็นระยะ</div><button id="backup" class="btn full">ดาวน์โหลดไฟล์สำรอง JSON</button><div class="section-title">กู้คืนข้อมูลจากไฟล์สำรอง</div><div class="field"><label>เลือกไฟล์ JSON ที่เคยสำรองไว้</label><input id="restoreFile" type="file" accept="application/json,.json"></div><button id="restore" class="btn secondary full" style="margin-top:10px">นำเข้าข้อมูลจากไฟล์</button><div class="section-title">เริ่มต้นใหม่</div><button id="reset" class="btn danger full">ลบข้อมูลทั้งหมดในเครื่องนี้</button></div><div class="small muted">GLUR BAR · เวอร์ชันทดลองใช้งานในเครื่อง · ไม่ใช่ระบบ Cloud</div>`);document.getElementById('backup').onclick=()=>downloadBlob(JSON.stringify({...db,exportedAt:new Date().toISOString(),app:'GLUR BAR'},null,2),`glur-bar-backup-${dateNow()}.json`,'application/json');document.getElementById('restore').onclick=()=>{const file=document.getElementById('restoreFile').files[0];if(!file){toast('เลือกไฟล์สำรองก่อน');return}const reader=new FileReader();reader.onload=()=>{try{const parsed=JSON.parse(reader.result);if(!parsed||!Array.isArray(parsed.stock)||!Array.isArray(parsed.recipes)||!Array.isArray(parsed.sales))throw Error('invalid');if(!confirm('ข้อมูลปัจจุบันจะถูกแทนที่ด้วยข้อมูลในไฟล์ ต้องการดำเนินการต่อหรือไม่?'))return;db={...blank(),...parsed};saveDB();toast('กู้คืนข้อมูลสำเร็จ');renderSettings()}catch(err){toast('ไฟล์ไม่ถูกต้องหรือไม่ใช่ไฟล์สำรอง GLUR BAR')}};reader.readAsText(file)};document.getElementById('reset').onclick=()=>{if(!confirm('ยืนยันลบข้อมูลทั้งหมด? แนะนำให้ดาวน์โหลดไฟล์สำรองก่อน'))return;if(!confirm('ยืนยันอีกครั้ง: ข้อมูลสต๊อก สูตร ยอดขาย และค่าใช้จ่ายจะถูกลบ'))return;db=blank();saveDB();toast('ล้างข้อมูลแล้ว');renderSettings()}}
function downloadBlob(content,filename,type){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}

let recoveryMode = window.location.hash.includes('type=recovery');
function showResetPassword(message='',isError=false){
  recoveryMode=true;
  document.getElementById('glurAccount').classList.add('hidden');
  document.getElementById('nav').classList.add('hidden');
  document.getElementById('app').innerHTML=`<div class="auth-screen"><div class="card"><h2>ตั้งรหัสผ่านใหม่</h2><div class="small muted">GLUR BAR · PASSWORD RESET</div><form id="resetPasswordForm" class="stack"><div class="field"><label>รหัสผ่านใหม่ (อย่างน้อย 8 ตัวอักษร)</label><input name="password" type="password" autocomplete="new-password" minlength="8" required></div><div class="field"><label>ยืนยันรหัสผ่านใหม่</label><input name="confirm" type="password" autocomplete="new-password" minlength="8" required></div><button class="btn full" type="submit">บันทึกรหัสผ่านใหม่</button></form><div class="auth-status${isError?' error':''}" id="resetStatus" role="status">${esc(message)}</div></div></div>`;
  document.getElementById('resetPasswordForm').onsubmit=async e=>{
    e.preventDefault();const form=e.target, status=document.getElementById('resetStatus');
    const password=form.elements.password.value;
    if(password!==form.elements.confirm.value){status.textContent='รหัสผ่านทั้งสองช่องไม่ตรงกัน';status.classList.add('error');return}
    const button=form.querySelector('button');button.disabled=true;status.textContent='กำลังบันทึก…';
    try{
      const {data:{session},error:sessionError}=await glurSupabase.auth.getSession();
      if(sessionError||!session)throw new Error('ลิงก์กู้คืนหมดอายุหรือไม่ถูกต้อง กรุณาขอลิงก์ใหม่');
      const {error}=await glurSupabase.auth.updateUser({password});
      if(error)throw error;
      await glurSupabase.auth.signOut();
      recoveryMode=false;history.replaceState(null,'',location.pathname+location.search);
      authScreen('ตั้งรหัสผ่านใหม่สำเร็จ เข้าสู่ระบบด้วย ID owner001 และรหัสผ่านใหม่ได้เลย');
    }catch(err){status.textContent=err.message||'ตั้งรหัสผ่านไม่สำเร็จ';status.classList.add('error')}
    finally{button.disabled=false}
  };
}
function showForgotPassword(){

function authScreen(message='',isError=false){
  document.getElementById('glurAccount').classList.add('hidden');
  document.getElementById('nav').classList.add('hidden');
  document.getElementById('app').innerHTML=`<div class="auth-screen"><div class="card"><h2>เข้าสู่ระบบ GLUR BAR</h2><div class="small muted">STAFF LOGIN · เข้าสู่ระบบด้วย ID และรหัสผ่าน</div><form id="authForm" class="stack"><div class="field"><label>ID ผู้ใช้งาน</label><input name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" pattern="[a-z0-9_]{3,30}" placeholder="เช่น owner001" required></div><div class="field"><label>รหัสผ่าน</label><input name="password" type="password" autocomplete="current-password" required></div><button id="authSubmit" type="submit" class="btn full">เข้าสู่ระบบ</button></form><button class="btn secondary full" id="forgotPasswordBtn" type="button" style="margin-top:8px">ลืมรหัสผ่าน / ตั้งรหัสผ่านใหม่</button><div id="authStatus" class="auth-status${isError?' error':''}" role="status">${esc(message)}</div><div class="hint">เจ้าของร้านเป็นผู้สร้างบัญชีพนักงาน ไม่มีการสมัครสมาชิกเอง · สต๊อกใช้ Supabase ออนไลน์ ส่วนสูตรและยอดขายเดิมยังอยู่ในเบราว์เซอร์</div></div></div>`;
  document.getElementById('forgotPasswordBtn').onclick=showForgotPassword;
  document.getElementById('authForm').onsubmit=async e=>{
    e.preventDefault();
    const button=document.getElementById('authSubmit');
    const status=document.getElementById('authStatus');
    button.disabled=true;status.textContent='กำลังเข้าสู่ระบบ…';status.classList.remove('error');
    try{
      const d=new FormData(e.target);
      const username=String(d.get('username')||'').trim().toLowerCase();
      const password=String(d.get('password')||'');
      const response=await fetch(SUPABASE_URL+'/functions/v1/glur-login',{
        method:'POST',
        headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY},
        body:JSON.stringify({username,password})
      });
      const result=await response.json();
      if(!response.ok||!result.access_token||!result.refresh_token){
        throw new Error(response.status===401?'ID หรือรหัสผ่านไม่ถูกต้อง':(result.error||'ไม่สามารถเข้าสู่ระบบได้'));
      }
      const {data,error}=await glurSupabase.auth.setSession({
        access_token:result.access_token,
        refresh_token:result.refresh_token
      });
      if(error||!data.user)throw new Error(error?.message||'ไม่สามารถเริ่มเซสชันได้');
      showAuthenticated(data.user);
    }catch(err){status.textContent=err.message||'เกิดข้อผิดพลาดในการเข้าสู่ระบบ';status.classList.add('error')}
    finally{button.disabled=false}
  };
}
let glurAccountLookupSerial=0;
async function updateGlurAccount(user){
  const serial=++glurAccountLookupSerial;
  const el=document.getElementById('glurAccountText');
  el.textContent='บัญชี '+user.id.slice(0,8)+'… · กำลังตรวจสอบสิทธิ์';
  try{
    const [{data:members,error:memberError},{data:usernames,error:nameError}]=await Promise.all([
      glurSupabase.from('glur_members').select('role').eq('shop_id',GLUR_SHOP_ID).eq('user_id',user.id).limit(1),
      glurSupabase.from('glur_usernames').select('username').eq('user_id',user.id).limit(1)
    ]);
    if(serial!==glurAccountLookupSerial||currentUser?.id!==user.id)return;
    const role=memberError?'ตรวจสอบสิทธิ์ไม่ได้':(members?.[0]?.role||'ไม่พบสิทธิ์ในร้าน');
    const name=!nameError&&usernames?.[0]?.username?usernames[0].username:'ID '+user.id.slice(0,8)+'…';
    el.textContent=name+' · '+role;
  }catch(e){if(serial===glurAccountLookupSerial)el.textContent='ID '+user.id.slice(0,8)+'… · ไม่สามารถโหลดสิทธิ์ได้'}
}
async function glurLogout(){

async function initAuth(){
  document.getElementById('nav').classList.add('hidden');
  document.getElementById('app').innerHTML='<div class="auth-screen"><div class="card">กำลังตรวจสอบการเข้าสู่ระบบ…</div></div>';
  try{
    if(!window.supabase)throw new Error('ไม่สามารถโหลด Supabase Client ได้');
    const {data,error}=await glurSupabase.auth.getSession();
    if(error)throw error;
    if(recoveryMode){showResetPassword(data.session?'':'กำลังตรวจสอบลิงก์กู้คืน…');return}
    if(data.session?.user)showAuthenticated(data.session.user);else authScreen();
  }catch(e){authScreen('ไม่สามารถตรวจสอบการเข้าสู่ระบบ: '+e.message,true)}
}
glurSupabase.auth.onAuthStateChange((event,session)=>{
  if(event==='PASSWORD_RECOVERY'){recoveryMode=true;showResetPassword();return}
  if(recoveryMode)return;
  if(event==='SIGNED_OUT'){currentUser=null;glurAccountLookupSerial++;document.getElementById('glurAccount').classList.add('hidden');authScreen()}
  else if(event==='SIGNED_IN'&&session?.user&&currentUser?.id!==session.user.id)showAuthenticated(session.user);
});

}
function renderRecipeDetail(){const r=db.recipes.find(x=>x.id===recipeDetailId);if(!r){recipeDetailId=null;renderRecipes();return}const cost=recipeCost(r),profit=num(r.price)-cost;
 shell('รายละเอียดสูตร',`<button class="back-link" id="recipeBack">‹ กลับไปสูตรทั้งหมด</button><div class="card"><div class="image-slot">${r.imageUrl?`<img src="${esc(r.imageUrl)}" alt="${esc(r.name)}">`:'🍸 ไม่มีรูปภาพสูตรในข้อมูลเดิม'}</div><div class="detail-head" style="margin-top:13px"><div><h2>${esc(r.name)}</h2><div class="small muted">${esc(r.note||'ยังไม่มีคำอธิบาย')}</div></div><span class="pill">อ่านอย่างเดียว</span></div><div class="kpi-grid"><div class="kpi"><small>ราคาขาย</small><strong>${money(r.price)}</strong></div><div class="kpi"><small>ต้นทุน</small><strong>${money(cost)}</strong></div><div class="kpi"><small>กำไรขั้นต้น</small><strong>${money(profit)}</strong></div></div><div class="section-title">ส่วนผสมต่อ 1 แก้ว</div>${(r.ingredients||[]).map(ing=>{const s=stockById(ing.stockId);return `<div class="tableline"><span>${esc(s?.name||'วัตถุดิบเดิมไม่พบ')} <span class="small muted">${num(ing.qty)} ${esc(s?.unit||'')}</span></span><strong>${s?money(num(ing.qty)*num(s.cost)):'—'}</strong></div>`}).join('')||empty('ยังไม่มีส่วนผสม')}<div class="section-title">วิธีทำ · Method</div><div class="small muted">${esc(r.method||'ยังไม่ได้บันทึกวิธีทำ')}</div><div class="section-title">การตกแต่ง · Garnish</div><div class="small muted">${esc(r.garnish||'ยังไม่ได้บันทึก')}</div><div class="section-title">แก้วที่ใช้ · Glassware</div><div class="small muted">${esc(r.glassware||'ยังไม่ได้บันทึก')}</div></div><div class="hint">การเพิ่มรูปภาพและแก้ไขรายละเอียดสูตรออนไลน์ต้องสร้างระบบเก็บสูตรและรูปภาพใน Supabase ก่อน เพื่อให้ทุกเครื่องเห็นตรงกัน</div>`);
 document.getElementById('recipeBack').onclick=()=>{recipeDetailId=null;renderRecipes()};
}
// Prevent read-only hint from disabling navigation inside the recipe detail view.
const originalRender=render;
render=function(){if(!currentUser)return;if(page==='stock'){renderStock();return}if(page==='recipes'){renderRecipes();return}if(page==='receiving'){renderReceiving();return}originalRender()};

// GLUR BAR cloud recipes: online data only, sales and receiving remain disabled.
let cloudRecipes=[],recipeCloudError='',recipeCloudReady=false,recipeEditMode=false;
const recipeFields=['name','selling_price','category','description','method','technique','glassware','garnish','notes','image_path'];
function recipeImage(r){const p=String(r.image_path||'');if(!p)return '';if(/^https:\/\//i.test(p))return p;if(p.includes('..')||p.startsWith('/'))return '';return glurSupabase.storage.from('glur-recipe-images').getPublicUrl(p).data.publicUrl}
function cloudRecipeCost(r){return (r.ingredients||[]).reduce((a,i)=>{const s=cloudStock.find(x=>x.id===i.stock_id);return a+(s?num(i.quantity)*num(s.cost_per_unit):0)},0)}
async function loadCloudRecipes(){recipeCloudError='';const {data,error}=await glurSupabase.from('glur_recipes').select('id,shop_id,name,selling_price,category,description,method,technique,glassware,garnish,notes,image_path,created_at').eq('shop_id',GLUR_SHOP_ID).order('created_at',{ascending:false});if(error){recipeCloudError=error.message;recipeCloudReady=false}else{const {data:ings,error:ie}=await glurSupabase.from('glur_recipe_ingredients').select('shop_id,recipe_id,stock_id,quantity').eq('shop_id',GLUR_SHOP_ID);if(ie){recipeCloudError=ie.message;recipeCloudReady=false}else{cloudRecipes=(data||[]).map(r=>({...r,ingredients:(ings||[]).filter(i=>i.recipe_id===r.id)}));recipeCloudReady=true}}if(currentUser&&page==='recipes')renderRecipes()}
function renderRecipes(){
 if(recipeDetailId){renderRecipeDetail();return}
 const list=cloudRecipes.filter(r=>String(r.name).toLowerCase().includes(recipeSearch.toLowerCase()));
 shell('สูตรเครื่องดื่ม',`<div class="compact-toolbar"><input id="recipeSearch" placeholder="⌕ ค้นหาสูตรเครื่องดื่ม..." value="${esc(recipeSearch)}"><button class="btn secondary smallbtn" id="recipeRefresh">↻</button><button class="btn smallbtn" id="recipeCreate">＋ เพิ่มสูตร</button></div>${recipeCloudError?`<div class="hint warn">โหลดสูตรไม่สำเร็จ: ${esc(recipeCloudError)}</div>`:''}<div class="row between small muted" style="margin-bottom:10px"><span>${list.length} สูตรออนไลน์</span><span>Supabase</span></div><div class="recipe-grid">${list.map(r=>`<button class="recipe-tile" data-recipe="${r.id}"><div class="recipe-cover">${recipeImage(r)?`<img src="${esc(recipeImage(r))}" alt="${esc(r.name)}">`:'🍸'}</div><div class="recipe-info"><strong>${esc(r.name)}</strong><small>${(r.ingredients||[]).length} ส่วนผสม · ${esc(r.category||'Classic')}</small><div class="row between" style="margin-top:6px"><span class="small muted">ต้นทุน ${money(cloudRecipeCost(r))}</span><strong>${money(r.selling_price)}</strong></div></div></button>`).join('')}</div>${!list.length?empty(recipeCloudReady?'ยังไม่มีสูตรออนไลน์ กด + เพิ่มสูตร เพื่อเริ่มต้น':'กำลังโหลดสูตรออนไลน์…'):''}<div class="hint">สูตรออนไลน์ใช้วัตถุดิบจากสต๊อก Supabase · เมนูขายและรับเข้ายังปิดบันทึกชั่วคราว</div>`);
 document.getElementById('recipeSearch').oninput=e=>{recipeSearch=e.target.value;const pos=e.target.selectionStart;renderRecipes();const inp=document.getElementById('recipeSearch');inp.focus();inp.setSelectionRange(pos,pos)};
 document.getElementById('recipeRefresh').onclick=loadCloudRecipes;
 document.getElementById('recipeCreate').onclick=()=>{recipeDetailId='new';recipeEditMode=true;renderRecipes()};
 document.querySelectorAll('[data-recipe]').forEach(b=>b.onclick=()=>{recipeDetailId=b.dataset.recipe;recipeEditMode=false;renderRecipes()});
}
function renderRecipeDetail(){
 const fresh=recipeDetailId==='new',r=fresh?{name:'',selling_price:0,category:'Classic',description:'',method:'',technique:'',glassware:'',garnish:'',notes:'',image_path:'',ingredients:[]}:cloudRecipes.find(x=>x.id===recipeDetailId);
 if(!r){recipeDetailId=null;renderRecipes();return}
 const edit=fresh||recipeEditMode,cost=cloudRecipeCost(r),profit=num(r.selling_price)-cost;
 const ingList=(r.ingredients||[]).map(i=>{const s=cloudStock.find(x=>x.id===i.stock_id);return `<div class="tableline"><span>${esc(s?.name||'ไม่พบวัตถุดิบ')} · ${num(i.quantity)} ${esc(s?.unit||'')}</span><strong>${s?money(num(i.quantity)*num(s.cost_per_unit)):'—'}</strong></div>`}).join('');
 const field=(key,label,kind='input')=>`<div class="field"><label>${label}</label>${kind==='textarea'?`<textarea name="${key}" rows="3">${esc(r[key]||'')}</textarea>`:`<input name="${key}" ${key==='name'?'required maxlength="150"':''} ${key==='selling_price'?'type="number" min="0" step="any" required':''} value="${esc(r[key]??'')}">`}</div>`;
 shell(fresh?'เพิ่มสูตรใหม่':'รายละเอียดสูตร',`<button class="back-link" id="recipeBack">‹ กลับไปสูตรทั้งหมด</button><div class="card">${!edit?`<div class="image-slot">${recipeImage(r)?`<img src="${esc(recipeImage(r))}" alt="${esc(r.name)}">`:'🍸 ยังไม่มีรูปสูตร'}</div><div class="detail-head" style="margin-top:12px"><div><h2>${esc(r.name)}</h2><div class="small muted">${esc(r.category||'Classic')} · ${esc(r.description||'')}</div></div><button class="btn smallbtn" id="recipeEdit">✎ แก้ไข</button></div><div class="kpi-grid"><div class="kpi"><small>ราคาขาย</small><strong>${money(r.selling_price)}</strong></div><div class="kpi"><small>ต้นทุน</small><strong>${money(cost)}</strong></div><div class="kpi"><small>กำไรขั้นต้น</small><strong>${money(profit)}</strong></div></div><div class="section-title">ส่วนผสมต่อแก้ว</div>${ingList||empty('ยังไม่มีส่วนผสม')}<div class="section-title">วิธีทำ · Method</div><div style="white-space:pre-wrap">${esc(r.method||'—')}</div><div class="section-title">เทคนิค · Technique</div><div>${esc(r.technique||'—')}</div><div class="section-title">Garnish / Glassware</div><div>${esc(r.garnish||'—')} · ${esc(r.glassware||'—')}</div><div class="section-title">หมายเหตุ</div><div style="white-space:pre-wrap">${esc(r.notes||'—')}</div>`:`<form id="recipeCloudForm" class="stack">${field('name','ชื่อเมนู')}${field('selling_price','ราคาขาย (บาท)')}<div class="formgrid">${field('category','หมวดหมู่ เช่น Signature / Classic / Ya Dong')}${field('glassware','แก้วที่ใช้ · Glassware')}${field('technique','เทคนิค · Technique')}</div>${field('description','คำอธิบาย / คาแรกเตอร์เครื่องดื่ม','textarea')}${field('method','วิธีทำ · Method','textarea')}${field('garnish','การตกแต่ง · Garnish','textarea')}${field('notes','หมายเหตุบาร์เทนเดอร์','textarea')}<div class="hint">รูปภาพ: ระบบอัปโหลด Supabase Storage จะเพิ่มในขั้นถัดไป ช่องนี้รับเฉพาะ URL รูปภาพ HTTPS ที่คุณมีอยู่แล้ว</div>${field('image_path','URL รูปภาพ (ไม่บังคับ)')}<div class="section-title">ส่วนผสมต่อ 1 แก้ว</div><div id="cloudIngredientRows"></div><button type="button" class="btn secondary" id="recipeAddIng">＋ เพิ่มส่วนผสม</button><div class="actions"><button type="submit" class="btn" id="recipeSave">บันทึกสูตรออนไลน์</button><button type="button" class="btn secondary" id="recipeCancel">ยกเลิก</button></div></form>`}</div>`);
 document.getElementById('recipeBack').onclick=()=>{recipeDetailId=null;recipeEditMode=false;renderRecipes()};
 if(!edit){document.getElementById('recipeEdit').onclick=()=>{recipeEditMode=true;renderRecipes()};return}
 document.getElementById('recipeCancel').onclick=()=>{if(fresh)recipeDetailId=null;recipeEditMode=false;renderRecipes()};
 const rows=document.getElementById('cloudIngredientRows');
 function addRow(stockId='',qty=''){const div=document.createElement('div');div.className='ingredient-row';div.innerHTML=`<select aria-label="วัตถุดิบ" required><option value="">เลือกวัตถุดิบ</option>${cloudStock.map(s=>`<option value="${s.id}" ${s.id===stockId?'selected':''}>${esc(s.name)} (${esc(s.unit)})</option>`).join('')}</select><input aria-label="ปริมาณ" type="number" step="any" min="0.000001" required placeholder="ปริมาณ" value="${esc(qty)}"><button type="button" class="btn danger smallbtn">×</button>`;div.querySelector('button').onclick=()=>div.remove();rows.appendChild(div)}
 (r.ingredients||[]).forEach(i=>addRow(i.stock_id,i.quantity));if(!(r.ingredients||[]).length)addRow();
 document.getElementById('recipeAddIng').onclick=()=>addRow();
 document.getElementById('recipeCloudForm').onsubmit=async e=>{
  e.preventDefault();const btn=document.getElementById('recipeSave');btn.disabled=true;
  try{
   const d=new FormData(e.target),payload={shop_id:GLUR_SHOP_ID};for(const key of recipeFields)payload[key]=key==='selling_price'?Number(d.get(key)):String(d.get(key)||'').trim();
   if(!payload.name||!Number.isFinite(payload.selling_price)||payload.selling_price<0)throw Error('ตรวจสอบชื่อและราคาขาย');
   if(payload.image_path&&!/^https:\/\//i.test(payload.image_path))throw Error('URL รูปภาพต้องขึ้นต้นด้วย https://');
   const ings=[...rows.children].map(el=>({stock_id:el.children[0].value,quantity:Number(el.children[1].value)}));
   if(!ings.length||ings.some(i=>!i.stock_id||!Number.isFinite(i.quantity)||i.quantity<=0))throw Error('เพิ่มส่วนผสมและปริมาณที่ถูกต้องอย่างน้อยหนึ่งรายการ');
   if(new Set(ings.map(i=>i.stock_id)).size!==ings.length)throw Error('วัตถุดิบซ้ำกัน กรุณารวมปริมาณเป็นแถวเดียว');
   let rid=r.id;
   if(fresh){const {data,error}=await glurSupabase.from('glur_recipes').insert(payload).select('id').single();if(error)throw error;rid=data.id}
   else{const {data,error}=await glurSupabase.from('glur_recipes').update(payload).eq('id',rid).eq('shop_id',GLUR_SHOP_ID).select('id').single();if(error)throw error;if(!data)throw Error('ไม่มีสิทธิ์แก้ไขสูตร')}
   const original=fresh?[]:(r.ingredients||[]).map(i=>({shop_id:GLUR_SHOP_ID,recipe_id:rid,stock_id:i.stock_id,quantity:i.quantity}));
   const {error:delErr}=await glurSupabase.from('glur_recipe_ingredients').delete().eq('shop_id',GLUR_SHOP_ID).eq('recipe_id',rid);if(delErr)throw delErr;
   const {error:ingErr}=await glurSupabase.from('glur_recipe_ingredients').insert(ings.map(i=>({...i,shop_id:GLUR_SHOP_ID,recipe_id:rid})));
   if(ingErr){if(original.length)await glurSupabase.from('glur_recipe_ingredients').insert(original);throw Error('บันทึกส่วนผสมไม่สำเร็จ: '+ingErr.message+' กรุณาตรวจสอบสูตรก่อนใช้งาน')}
   recipeDetailId=rid;recipeEditMode=false;toast('บันทึกสูตรออนไลน์สำเร็จ');await loadCloudRecipes();renderRecipes();
  }catch(err){toast(err.message||'บันทึกสูตรไม่สำเร็จ');btn.disabled=false}
 };
}
const glurOldShowAuthenticated=showAuthenticated;
showAuthenticated=function(user){glurOldShowAuthenticated(user);loadCloudRecipes()};
const glurOldSetPage=setPage;
setPage=function(p){glurOldSetPage(p);if(p==='recipes'&&!recipeCloudReady)loadCloudRecipes()};
const glurOldLoadCloudStock=loadCloudStock;
loadCloudStock=async function(){await glurOldLoadCloudStock();if(currentUser&&page==='recipes')renderRecipes()};


// Cloud receiving — one atomic RPC updates stock and inserts the receipt.
let cloudReceipts=[],receiptsReady=false,receiptsError='',receivingBusy=false;
async function loadCloudReceipts(){
  receiptsError='';
  const {data,error}=await glurSupabase.from('glur_stock_receipts')
    .select('id,shop_id,stock_id,quantity,total_cost,received_at,created_by,created_at')
    .eq('shop_id',GLUR_SHOP_ID).order('received_at',{ascending:false}).limit(100);
  if(error){receiptsError=error.message;receiptsReady=false}
  else{cloudReceipts=data||[];receiptsReady=true}
  if(currentUser&&page==='receiving')renderReceiving();
}
function renderReceiving(){
  if(!cloudReady){shell('รับวัตถุดิบเข้า',`<div class="card">${cloudError?esc(cloudError):'กำลังโหลดสต๊อกออนไลน์…'}</div>`);return}
  const stockOptions=cloudStock.map(s=>`<option value="${esc(s.id)}">${esc(s.name)} (${esc(s.unit)})</option>`).join('');
  const history=cloudReceipts.map(r=>{const s=cloudStock.find(x=>x.id===r.stock_id);const date=r.received_at?new Date(r.received_at).toLocaleString('th-TH',{dateStyle:'medium',timeStyle:'short'}):'—';return `<div class="item"><div style="min-width:0"><div class="item-name">${esc(s?.name||'วัตถุดิบที่ลบไปแล้ว')}</div><div class="small muted">${esc(date)} · รับเข้า ${num(r.quantity).toLocaleString('th-TH')} ${esc(s?.unit||'หน่วย')}</div></div><strong>${money(r.total_cost)}</strong></div>`}).join('');
  shell('รับวัตถุดิบเข้า · ออนไลน์',`<div class="hint">บันทึกผ่าน Supabase โดยเพิ่มจำนวนสต๊อก คำนวณต้นทุนเฉลี่ย และเก็บประวัติพร้อมกัน · สิทธิ์ Owner / Manager</div><div class="card"><div class="section-title" style="margin-top:0">รับของเข้า</div><form id="cloudReceiveForm" class="stack"><div class="field"><label>เลือกวัตถุดิบ</label><select name="stock_id" required>${stockOptions}</select></div><div id="receiveStockInfo" class="small muted"></div><div class="formgrid"><div class="field"><label>จำนวนรับเข้า (ตามหน่วยสต๊อก)</label><input name="quantity" type="number" min="0.000001" step="any" required placeholder="เช่น 1400"></div><div class="field"><label>ราคารวมที่ซื้อ (บาท)</label><input name="total_cost" type="number" min="0" step="any" required placeholder="เช่น 1498"></div></div><div id="receivePreview" class="hint">ระบุจำนวนและราคารวมเพื่อดูต้นทุนต่อหน่วย</div><button class="btn full" type="submit" ${!cloudStock.length||receivingBusy?'disabled':''}>${receivingBusy?'กำลังบันทึก…':'บันทึกรับเข้าออนไลน์'}</button></form></div><div class="row between"><div class="section-title">ประวัติรับเข้าล่าสุด</div><button id="refreshReceipts" class="btn secondary smallbtn">↻ รีเฟรช</button></div>${receiptsError?`<div class="hint warn">โหลดประวัติไม่ได้: ${esc(receiptsError)}</div>`:''}<div class="card">${!receiptsReady&&!receiptsError?'กำลังโหลดประวัติ…':history||empty('ยังไม่มีประวัติรับเข้า')}</div><div class="small muted">แสดงประวัติล่าสุด 100 รายการ · วันที่และเวลาอ้างอิงเวลาบันทึกบนเซิร์ฟเวอร์</div>`);
  document.getElementById('refreshReceipts').onclick=loadCloudReceipts;
  const form=document.getElementById('cloudReceiveForm');
  const update=()=>{
    const s=cloudStock.find(x=>x.id===form.elements.stock_id.value);
    document.getElementById('receiveStockInfo').textContent=s?`คงเหลือ ${num(s.quantity).toLocaleString('th-TH')} ${s.unit} · ต้นทุนเดิม ${money(s.cost_per_unit)}/${s.unit}`:'';
    const q=Number(form.elements.quantity.value),cost=Number(form.elements.total_cost.value);
    document.getElementById('receivePreview').textContent=s&&form.elements.quantity.value!==''&&form.elements.total_cost.value!==''&&q>0&&cost>=0?`ต้นทุนรับเข้าต่อ ${s.unit}: ${money(cost/q)} · คงเหลือหลังรับเข้า (ประมาณ): ${(num(s.quantity)+q).toLocaleString('th-TH')} ${s.unit}`:'ระบุจำนวนและราคารวมเพื่อดูต้นทุนต่อหน่วย';
  };
  form.oninput=update;form.elements.stock_id.onchange=update;update();
  form.onsubmit=async e=>{
    e.preventDefault();if(receivingBusy)return;
    const sid=form.elements.stock_id.value,q=Number(form.elements.quantity.value),cost=Number(form.elements.total_cost.value),s=cloudStock.find(x=>x.id===sid);
    if(!s||!Number.isFinite(q)||q<=0||!Number.isFinite(cost)||cost<0){toast('ตรวจสอบจำนวนและราคารวม');return}
    if(!confirm(`ยืนยันรับ ${s.name} เพิ่ม ${q} ${s.unit} ราคารวม ${money(cost)}?`))return;
    receivingBusy=true;const button=form.querySelector('[type=submit]');button.disabled=true;button.textContent='กำลังบันทึก…';
    try{
      const {error}=await glurSupabase.rpc('glur_receive_stock',{p_shop_id:GLUR_SHOP_ID,p_stock_id:sid,p_quantity:q,p_total_cost:cost});
      if(error)throw error;
      toast('รับสต๊อกออนไลน์สำเร็จ');
      await Promise.all([loadCloudStock(),loadCloudReceipts()]);
    }catch(err){toast('รับเข้าไม่สำเร็จ: '+(err.message||err))}
    finally{receivingBusy=false;if(currentUser&&page==='receiving')renderReceiving()}
  };
}
const glurReceiveOldSetPage=setPage;
setPage=function(p){glurReceiveOldSetPage(p);if(p==='receiving')loadCloudReceipts()};
const glurReceiveOldShowAuthenticated=showAuthenticated;
showAuthenticated=function(user){glurReceiveOldShowAuthenticated(user);loadCloudReceipts()};

initAuth();
</script>

<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">

<title>GLUR BAR — Stock & Sales</title>
<style>
:root{--bg:#FFF8F2;--panel:#FFFFFF;--panel2:#FFF0E5;--gold:#F47721;--gold2:#E96512;--text:#302820;--muted:#8A786B;--line:#F0D7C5;--red:#D83B32;--green:#278653}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
.top{padding:20px 16px 14px;background:linear-gradient(130deg,#F47721,#FF914D 75%);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.brand{color:#FFFFFF;font-size:22px;font-weight:800;letter-spacing:2px}
.sub{color:#FFF4EB;font-size:12px;margin-top:2px}
.wrap{max-width:900px;margin:auto;padding:16px 14px 100px}
.page-title{font-size:22px;font-weight:750;margin:4px 0 14px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;min-width:0;box-shadow:0 2px 8px #8C4A1710}
.metric-label{font-size:12px;color:var(--muted)}
.metric{font-size:24px;color:var(--gold2);font-weight:750;margin-top:5px;overflow-wrap:anywhere}
.section-title{font-size:16px;font-weight:700;margin:18px 0 10px}
.muted{color:var(--muted)}
.small{font-size:12px}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:9px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0;flex:1}
.field label{font-size:12px;color:var(--muted)}
input,select{width:100%;min-width:0;border:1px solid var(--line);background:#FFFFFF;color:var(--text);border-radius:9px;padding:11px 10px;outline:none}
input:focus,select:focus{border-color:var(--gold)}
.btn{border:1px solid var(--gold);background:var(--gold);color:#FFFFFF;font-weight:750;border-radius:10px;padding:11px 13px}
.btn.secondary{background:#FFFFFF;color:var(--gold2)}
.btn.danger{border-color:#E8B7B2;background:#FFF0EE;color:#B42318}
.btn.smallbtn{padding:7px 10px;font-size:12px}
.full{width:100%}
.nav{position:fixed;z-index:10;bottom:0;left:0;right:0;display:flex;overflow-x:auto;background:#FFFFFF;border-top:1px solid var(--line);padding:7px max(7px,env(safe-area-inset-right)) calc(7px + env(safe-area-inset-bottom)) max(7px,env(safe-area-inset-left));gap:4px}
.nav button{flex:1;min-width:65px;border:0;background:transparent;color:var(--muted);padding:8px 5px;border-radius:9px;font-size:11px}
.nav button span{display:block;font-size:18px;margin-bottom:3px}
.nav button.active{color:#FFFFFF;background:var(--gold)}
.item{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item-name{font-weight:650;overflow-wrap:anywhere}
.pill{display:inline-block;border:1px solid var(--line);border-radius:20px;padding:3px 8px;font-size:11px;color:var(--muted)}
.warn{color:var(--red)}
.good{color:var(--green)}
.empty{padding:20px 8px;text-align:center;color:var(--muted)}
.hidden{display:none!important}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.formgrid .wide{grid-column:1/-1}
.ingredient-row{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(60px,.8fr) 38px;gap:6px;margin:7px 0}
.ingredient-row input,.ingredient-row select{padding:9px 7px}
.tableline{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.tableline:last-child{border-bottom:0}
.toast{position:fixed;z-index:20;left:50%;bottom:88px;transform:translateX(-50%);background:#FFF0D9;color:#7A3109;padding:10px 16px;border-radius:20px;box-shadow:0 5px 24px #0002;max-width:90%;font-weight:650}
.hint{border-left:3px solid var(--gold);padding:8px 10px;background:#FFF0E5;border-radius:0 8px 8px 0;color:#70401F;font-size:12px;margin:10px 0}
.actions{display:flex;gap:7px;flex-wrap:wrap}
@media(min-width:650px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.wrap{padding-top:22px}.formgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}

.auth-screen{max-width:420px;margin:38px auto;padding:0 12px}
.auth-screen .card{padding:22px}
.auth-screen h2{margin:0 0 7px;font-size:23px}
.auth-screen .stack{margin-top:18px}
.auth-status{font-size:13px;margin:12px 0;color:var(--muted)}
.auth-status.error{color:var(--red)}
.account-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 12px;font-size:12px;color:var(--muted)}

/* GLUR BAR — charcoal & ember compact redesign */
:root{--bg:#0e0d0d;--panel:#1a1716;--panel2:#27201d;--gold:#f47721;--gold2:#ff9b54;--text:#f6eee8;--muted:#b4a69b;--line:#40312a;--red:#ff7567;--green:#65d39a}
body{background:radial-gradient(ellipse at 70% -10%,#3b1d13 0%,transparent 45%),var(--bg);color:var(--text);font-size:14px}
.top{background:linear-gradient(100deg,#21120d,#401e11 60%,#160f0c);padding:15px 18px;border-bottom:1px solid #643a27;box-shadow:0 5px 25px #0005}
.brand{color:#ff9b54;font-size:27px;font-weight:950;letter-spacing:3px;text-shadow:0 2px 15px #f4772140}

.wrap{max-width:1240px;padding:16px 12px 105px}
.page-title{font-size:20px;margin:5px 0 12px;letter-spacing:.2px}
.card{background:linear-gradient(140deg,#211b18,#171514);border-color:var(--line);border-radius:13px;padding:12px;box-shadow:0 5px 24px #0002}
.metric{color:var(--gold2);font-size:22px}
.section-title{font-size:15px;margin:15px 0 9px}
input,select,textarea{background:#171514;color:var(--text);border:1px solid #504039;border-radius:9px;padding:10px}
input::placeholder,textarea::placeholder{color:#89776d}
.btn{background:linear-gradient(120deg,#e96a1d,#f99044);border-color:#ed7a33;color:#1a100b;padding:9px 12px}
.btn.secondary{background:#29211e;color:#ffc096;border-color:#755039}
.btn.danger{background:#35201e;color:#ff9588;border-color:#7d3b34}
.nav{background:#181413;border-color:#473127;box-shadow:0 -6px 25px #0007}
.nav button{color:#c0a99c;min-width:62px}
.nav button.active{background:#bd4f19;color:#fff}
.item{padding:9px 0;border-color:#3c2f29}
.item-name{font-size:13px}
.pill{border-color:#594036;color:#e0bca5}
.hint{background:#302018;color:#e9bb9c;border-color:#f47721}
.toast{background:#f9b27a;color:#251208}
.account-bar{padding:5px 0 9px}
.compact-toolbar{display:flex;gap:7px;align-items:center;margin-bottom:9px}
.compact-toolbar input{flex:1}
.chip-row{display:flex;gap:6px;overflow-x:auto;padding:2px 0 9px;scrollbar-width:thin}
.chip{white-space:nowrap;border:1px solid #544037;background:#241c19;color:#d8c0b0;border-radius:8px;padding:7px 10px;font-size:12px}
.chip.active{background:#d86520;border-color:#f18c4c;color:#fff}
.stock-entry{width:100%;display:flex;align-items:center;justify-content:space-between;gap:9px;border:0;border-bottom:1px solid #3c2f29;background:transparent;color:inherit;padding:11px 2px;text-align:left}
.stock-entry:last-child{border-bottom:0}
.stock-entry:hover,.recipe-tile:hover{background:#2a201c}
.stock-entry .right{text-align:right;white-space:nowrap}
.status-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:5px}
.status-dot.low{background:#ff8d42}.status-dot.out{background:var(--red)}
.back-link{border:0;background:none;color:#ffa266;padding:4px 0 12px;font-weight:700}
.detail-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.detail-head h2{margin:0;font-size:21px}
.detail-value{font-size:29px;font-weight:800;color:#ff9a53}
.detail-sub{font-size:12px;color:var(--muted)}
.recipe-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.recipe-tile{border:1px solid #463126;border-radius:13px;overflow:hidden;background:#211916;color:var(--text);text-align:left;padding:0}
.recipe-cover{height:115px;background:linear-gradient(135deg,#683018,#24140e);display:flex;align-items:center;justify-content:center;font-size:36px;overflow:hidden}
.recipe-cover img{width:100%;height:100%;object-fit:cover}
.recipe-info{padding:9px}.recipe-info strong{display:block;font-size:13px}.recipe-info small{color:#c9a994}
.kpi-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin:12px 0}
.kpi{padding:10px 8px;border:1px solid #48332a;background:#261e1a;border-radius:10px;min-width:0}
.kpi small{display:block;color:#bda99b;font-size:10px}.kpi strong{font-size:16px;overflow-wrap:anywhere}
.image-slot{height:200px;background:linear-gradient(135deg,#5b2b19,#1c1411);border-radius:12px;display:flex;align-items:center;justify-content:center;color:#e4b08a;overflow:hidden}
.image-slot img{width:100%;height:100%;object-fit:cover}
@media(min-width:850px){.wrap{padding-left:190px;padding-right:22px}.nav{top:92px;bottom:0;right:auto;width:172px;flex-direction:column;justify-content:flex-start;overflow-y:auto;padding:15px 9px}.nav button{display:flex;align-items:center;text-align:left;font-size:13px;gap:9px;padding:12px}.nav button span{font-size:19px;margin:0}.recipe-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.recipe-cover{height:155px}}

/* Persistent user session controls — outside #app so page rerenders cannot remove them */
.glur-account{position:sticky;top:0;z-index:12;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px max(14px,calc((100vw - 1210px)/2));background:#1d1714;border-bottom:1px solid #5b3a29;color:#f7e5d6;font-size:12px}

.glur-account .btn{flex-shrink:0}

}

@media (min-width:850px) and (max-height:740px){.nav{padding-top:9px}.nav button{min-height:37px;padding-top:8px;padding-bottom:8px}.nav .nav-group{padding-top:11px;padding-bottom:4px}}

/* GLUR BAR responsive layout — mobile / tablet / desktop */
html{min-width:0;-webkit-text-size-adjust:100%}

.actions{align-items:center}

/* GLUR BAR — redesigned employee permission dialog */
.glur-perm-dialog{width:min(1120px,calc(100vw - 24px));max-width:1120px;max-height:min(92vh,1000px);padding:0;border:1px solid #554936;border-radius:20px;background:#121212;color:#f6f0e7;box-shadow:0 28px 90px #0009;overflow:auto}
.glur-perm-dialog::backdrop{background:#000b;backdrop-filter:blur(3px)}
.glur-perm-dialog *{box-sizing:border-box}
.glur-perm-shell{padding:24px}
.glur-perm-heading,.glur-perm-person,.glur-perm-footer{display:flex;align-items:center;justify-content:space-between;gap:16px}
.glur-perm-heading h2{margin:0;color:#f3c66e;font-size:23px}.glur-perm-heading p,.glur-perm-presets p{margin:5px 0 0;color:#b6ada0;font-size:13px}

.glur-perm-role{border:1px solid #bb944e;border-radius:24px;padding:6px 13px;color:#f1c879;font-size:12px}

<script>
/* Position desktop sidebar below both sticky header and account bar. */
(function(){
  const header=document.querySelector('.top');
  const account=document.getElementById('glurAccount');
  const nav=document.getElementById('nav');
  if(!header||!account||!nav)return;
  const position=()=>{
    if(window.innerWidth<850){nav.style.removeProperty('top');return;}
    const headerBottom=header.getBoundingClientRect().bottom;
    const accountBottom=account.classList.contains('hidden')?headerBottom:account.getBoundingClientRect().bottom;
    nav.style.top=Math.max(headerBottom,accountBottom,0)+ 'px';
  };
  if(window.ResizeObserver){const ro=new ResizeObserver(position);ro.observe(header);ro.observe(account);}
  new MutationObserver(position).observe(account,{attributes:true,attributeFilter:['class']});
  window.addEventListener('resize',position);
  position();
})();

tches.length)list.textContent='ไม่พบวัตถุดิบ ลองค้นหาคำอื่น'}input.oninput=render;d.querySelector('[data-close]').onclick=()=>d.close();d.onclose=()=>d.remove();render();d.showModal();input.focus()}

ue="${esc(qty)}"><button type="button" class="btn danger smallbtn" aria-label="ลบแถว">×</button>`;div.querySelector('button').onclick=()=>div.remove();rows.appendChild(div)}addRow();document.getElementById('addIngredient').onclick=()=>addRow();document.getElementById('recipeForm').addEventListener('submit',e=>{e.preventDefault();const d=new FormData(e.target),ingredients=[...rows.children].map(el=>({stockId:el.children[0].value,qty:num(el.children[1].value)})).filter(x=>x.stockId&&x.qty>0);if(!ingredients.length){toast('เพิ่มวัตถุดิบอย่างน้อย 1 รายการ');return}db.recipes.push({id:id(),name:String(d.get('name')).trim(),price:num(d.get('price')),note:String(d.get('note')||''),ingredients});saveDB();toast('บันทึกสูตรแล้ว');renderRecipes()})}
function editRecipe(rid){const r=db.recipes.find(x=>x.id===rid);if(!r)return;const name=prompt('ชื่อเมนู',r.name);if(name===null)return;const price=prompt('ราคาขาย (บาท)',r.price);if(price===null)return;r.name=name.trim()||r.name;r.price=Math.max(0,num(price));saveDB();renderRecipes();toast('แก้ไขชื่อและราคาแล้ว')}
function deleteRecipe(rid){if(!confirm('ลบสูตรนี้หรือไม่?'))return;db.recipes=db.recipes.filter(r=>r.id!==rid);saveDB();renderRecipes()}
function renderSales(){shell('บันทึกยอดขาย',`<div class="card"><div class="section-title" style="margin-top:0">ขายเมนูจากสูตร</div>${db.recipes.length?'':empty('เพิ่มสูตรเครื่องดื่มก่อนเริ่มบันทึกขาย')}<form id="saleForm" class="stack"><div class="field"><label>เมนู</label><select name="recipe" required>${db.recipes.map(r=>`<option value="${r.id}">${esc(r.name)} — ${money(r.price)}</option>`).join('')}</select></div><div class="formgrid"><div class="field"><label>จำนวนแก้ว</label><input name="qty" type="number" min="1" step="1" value="1" required></div><div class="field"><label>วันที่ขาย</label><input name="date" type="date" value="${dateNow()}" required></div></div><div class="hint">ระบบจะตรวจสต๊อก ตัดวัตถุดิบตามสูตร และบันทึกยอดขายพร้อมต้นทุน ณ วันที่ขาย</div><button class="btn full" type="submit" ${db.recipes.length?'':'disabled'}>บันทึกการขายและตัดสต๊อก</button></form></div><div class="section-title">ประวัติการขายล่าสุด</div><div class="card">${db.sales.length?[...db.sales].reverse().slice(0,30).map(s=>`<div class="item"><div><div class="item-name">${esc(s.name)} × ${s.qty}</div><div class="small muted">${esc(s.date)} · ต้นทุน ${money(s.cost)}</div></div><strong>${money(s.revenue)}</strong></div>`).join(''):empty('ยังไม่มีรายการขาย')}</div>`);document.getElementById('saleForm').addEventListener('submit',e=>{e.preventDefault();const d=new FormData(e.target),r=db.recipes.find(x=>x.id===d.get('recipe')),qty=Math.max(1,Math.floor(num(d.get('qty'))));if(!r)return;for(const ing of r.ingredients){const s=stockById(ing.stockId),need=num(ing.qty)*qty;if(!s||num(s.qty)<need){toast(`สต๊อกไม่พอ: ${s?s.name:'วัตถุดิบถูกลบ'}`);return}}for(const ing of r.ingredients){const s=stockById(ing.stockId);s.qty=Number((num(s.qty)-num(ing.qty)*qty).toFixed(4))}db.sales.push({id:id(),date:d.get('date')||dateNow(),recipeId:r.id,name:r.name,qty,revenue:num(r.price)*qty,cost:recipeCost(r)*qty});saveDB();toast('บันทึกยอดขายและตัดสต๊อกแล้ว');renderSales()})}
function renderReceiving(){shell('รับวัตถุดิบเข้า',`<div class="card"><div class="section-title" style="margin-top:0">บันทึกรับเข้า</div>${db.stock.length?'':empty('เพิ่มวัตถุดิบในเมนูสต๊อกก่อน')}<form id="receiveForm" class="stack"><div class="field"><label>วัตถุดิบ</label><select name="stock" required>${db.stock.map(s=>`<option value="${s.id}">${esc(s.name)} (${esc(s.unit)})</option>`).join('')}</select></div><div class="formgrid"><div class="field"><label>จำนวนที่รับเข้า (หน่วยหลัก)</label><input name="qty" type="number" min="0.0001" step="any" required /></div><div class="field"><label>ราคารวมที่ซื้อ (บาท)</label><input name="cost" type="number" min="0" step="any" required /></div><div class="field"><label>วันที่รับเข้า</label><input name="date" type="date" value="${dateNow()}" required /></div></div><div class="hint">ต้นทุนต่อหน่วยจะคำนวณเป็นค่าเฉลี่ยถ่วงน้ำหนักจากสต๊อกเดิมและของที่รับเข้า</div><button class="btn full" type="submit" ${db.stock.length?'':'disabled'}>บันทึกรับเข้า</button></form></div><div class="section-title">ประวัติรับเข้า</div><div class="card">${db.receipts.length?[...db.receipts].reverse().slice(0,30).map(x=>`<div class="item"><div><div class="item-name">${esc(x.name)} +${x.qty} ${esc(x.unit)}</div><div class="small muted">${esc(x.date)} · ${money(x.cost)} รวม</div></div><strong>${money(x.unitCost)}/${esc(x.unit)}</strong></div>`).join(''):empty('ยังไม่มีรายการรับเข้า')}</div>`);document.getElementById('receiveForm').addEventListener('submit',e=>{e.preventDefault();const d=new FormData(e.target),s=stockById(d.get('stock')),qty=num(d.get('qty')),cost=num(d.get('cost'));if(!s||qty<=0)return;const oldQty=num(s.qty),newQty=oldQty+qty;s.cost=newQty>0?(oldQty*num(s.cost)+cost)/newQty:0;s.qty=newQty;db.receipts.push({id:id(),date:d.get('date')||dateNow(),stockId:s.id,name:s.name,unit:s.unit,qty,cost,unitCost:qty?cost/qty:0});saveDB();toast('รับวัตถุดิบเข้าแล้ว');renderReceiving()})}
function renderCosts(){shell('ค่าใช้จ่าย',`<div class="card"><div class="section-title" style="margin-top:0">เพิ่มค่าใช้จ่าย</div><form id="expenseForm" class="stack"><div class="field"><label>รายการ</label><input name="name" required /></div><div class="formgrid"><div class="field"><label>จำนวนเงิน (บาท)</label><input name="amount" type="number" min="0" step="any" required /></div><div class="field"><label>วันที่</label><input name="date" type="date" value="${dateNow()}" required /></div></div><button class="btn full" type="submit">＋ บันทึกค่าใช้จ่าย</button></form></div><div class="section-title">รายการค่าใช้จ่าย</div><div class="card">${db.expenses.length?[...db.expenses].reverse().map(x=>`<div class="item"><div><div class="item-name">${esc(x.name)}</div><div class="small muted">${esc(x.date)}</div></div><div class="row"><strong>${money(x.amount)}</strong><button class="btn danger smallbtn" onclick="deleteExpense('${x.id}')">ลบ</button></div></div>`).join(''):empty('ยังไม่มีค่าใช้จ่าย')}</div>`);document.getElementById('expenseForm').addEventListener('submit',e=>{e.preventDefault();const d=new FormData(e.target);db.expenses.push({id:id(),name:String(d.get('name')).trim(),amount:num(d.get('amount')),date:d.get('date')||dateNow()});saveDB();toast('บันทึกค่าใช้จ่ายแล้ว');renderCosts()})}
function deleteExpense(eid){if(!confirm('ลบรายการนี้หรือไม่?'))return;db.expenses=db.expenses.filter(x=>x.id!==eid);saveDB();renderCosts()}
function renderReports(){const m=monthNow(),ss=monthSales(m),rev=sum(ss,s=>num(s.revenue)),cogs=sum(ss,s=>num(s.cost)),ex=monthExpenses(m),expenses=sum(ex,x=>num(x.amount));shell('รายงานประจำเดือน',`<div class="card"><div class="field"><label>เลือกเดือน</label><input type="month" id="reportMonth" value="${m}"></div><div id="reportData" style="margin-top:14px"></div><button class="btn secondary full" style="margin-top:12px" id="exportCSV">ส่งออกรายการขาย CSV</button></div><div class="section-title">หมายเหตุการคำนวณ</div><div class="hint">กำไรสุทธิในรายงานนี้ = ยอดขาย − ต้นทุนสูตรของรายการขาย − ค่าใช้จ่ายที่บันทึกไว้ ไม่รวมค่าใช้จ่ายที่ยังไม่ได้บันทึกหรือภาษี</div>`);function update(){const mm=document.getElementById('reportMonth').value, sales=monthSales(mm), exps=monthExpenses(mm),revenue=sum(sales,s=>num(s.revenue)),cost=sum(sales,s=>num(s.cost)),other=sum(exps,x=>num(x.amount));document.getElementById('reportData').innerHTML=`<div class="stack">${[['ยอดขาย',money(revenue)],['ต้นทุนสินค้าที่ขาย',money(cost)],['กำไรขั้นต้น',money(revenue-cost)],['ค่าใช้จ่ายอื่น',money(other)],['กำไรหลังหักค่าใช้จ่าย',money(revenue-cost-other)],['จำนวนรายการขาย',sales.length+' รายการ']].map(([a,b])=>`<div class="tableline"><span class="muted">${a}</span><strong>${b}</strong></div>`).join('')}</div><div class="section-title">ขายดีในเดือนนี้</div>${(()=>{const tally={};sales.forEach(s=>tally[s.name]=(tally[s.name]||0)+num(s.qty));const top=Object.entries(tally).sort((a,b)=>b[1]-a[1]).slice(0,5);return top.length?top.map(([n,q])=>`<div class="tableline"><span>${esc(n)}</span><strong>${q} แก้ว</strong></div>`).join(''):empty('ไม่มีรายการขายในเดือนนี้')})()}`};update();document.getElementById('reportMonth').addEventListener('change',update);document.getElementById('exportCSV').onclick=()=>{const mm=document.getElementById('reportMonth').value,sales=monthSales(mm),rows=[['date','menu','quantity','revenue_THB','cost_THB'],...sales.map(s=>[s.date,s.name,s.qty,s.revenue,s.cost])];const csv='\ufeff'+rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');downloadBlob(csv,`glur-bar-sales-${mm}.csv`,'text/csv;charset=utf-8;') }}
function renderSettings(){shell('สำรองและกู้คืนข้อมูล',`<div class="card"><div class="section-title" style="margin-top:0">ข้อมูลของ GLUR BAR</div><div class="grid">${metric('วัตถุดิบ',db.stock.length+' รายการ')}${metric('สูตร',db.recipes.length+' รายการ')}${metric('ยอดขาย',db.sales.length+' รายการ')}${metric('ค่าใช้จ่าย',db.expenses.length+' รายการ')}</div><div class="hint">ข้อมูลเก็บอยู่ใน localStorage ของเบราว์เซอร์นี้ หากล้างข้อมูลเว็บไซต์ เปลี่ยนเบราว์เซอร์ หรือเครื่องเสีย ข้อมูลอาจหายได้ กรุณาดาวน์โหลดไฟล์สำรองเป็นระยะ</div><button id="backup" class="btn full">ดาวน์โหลดไฟล์สำรอง JSON</button><div class="section-title">กู้คืนข้อมูลจากไฟล์สำรอง</div><div class="field"><label>เลือกไฟล์ JSON ที่เคยสำรองไว้</label><input id="restoreFile" type="file" accept="application/json,.json"></div><button id="restore" class="btn secondary full" style="margin-top:10px">นำเข้าข้อมูลจากไฟล์</button><div class="section-title">เริ่มต้นใหม่</div><button id="reset" class="btn danger full">ลบข้อมูลทั้งหมดในเครื่องนี้</button></div><div class="small muted">GLUR BAR · เวอร์ชันทดลองใช้งานในเครื่อง · ไม่ใช่ระบบ Cloud</div>`);document.getElementById('backup').onclick=()=>downloadBlob(JSON.stringify({...db,exportedAt:new Date().toISOString(),app:'GLUR BAR'},null,2),`glur-bar-backup-${dateNow()}.json`,'application/json');document.getElementById('restore').onclick=()=>{const file=document.getElementById('restoreFile').files[0];if(!file){toast('เลือกไฟล์สำรองก่อน');return}const reader=new FileReader();reader.onload=()=>{try{const parsed=JSON.parse(reader.result);if(!parsed||!Array.isArray(parsed.stock)||!Array.isArray(parsed.recipes)||!Array.isArray(parsed.sales))throw Error('invalid');if(!confirm('ข้อมูลปัจจุบันจะถูกแทนที่ด้วยข้อมูลในไฟล์ ต้องการดำเนินการต่อหรือไม่?'))return;db={...blank(),...parsed};saveDB();toast('กู้คืนข้อมูลสำเร็จ');renderSettings()}catch(err){toast('ไฟล์ไม่ถูกต้องหรือไม่ใช่ไฟล์สำรอง GLUR BAR')}};reader.readAsText(file)};document.getElementById('reset').onclick=()=>{if(!confirm('ยืนยันลบข้อมูลทั้งหมด? แนะนำให้ดาวน์โหลดไฟล์สำรองก่อน'))return;if(!confirm('ยืนยันอีกครั้ง: ข้อมูลสต๊อก สูตร ยอดขาย และค่าใช้จ่ายจะถูกลบ'))return;db=blank();saveDB();toast('ล้างข้อมูลแล้ว');renderSettings()}}
function downloadBlob(content,filename,type){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
// Authentication + cloud stock pilot. Recipes, sales and receiving remain local-only and are temporarily disabled.
let currentUser=null;
let recoveryMode = window.location.hash.includes('type=recovery');
function showResetPassword(message='',isError=false){
  recoveryMode=true;
  document.getElementById('glurAccount').classList.add('hidden');
  document.getElementById('nav').classList.add('hidden');
  document.getElementById('app').innerHTML=`<div class="auth-screen"><div class="card"><h2>ตั้งรหัสผ่านใหม่</h2><div class="small muted">GLUR BAR · PASSWORD RESET</div><form id="resetPasswordForm" class="stack"><div class="field"><label>รหัสผ่านใหม่ (อย่างน้อย 8 ตัวอักษร)</label><input name="password" type="password" autocomplete="new-password" minlength="8" required></div><div class="field"><label>ยืนยันรหัสผ่านใหม่</label><input name="confirm" type="password" autocomplete="new-password" minlength="8" required></div><button class="btn full" type="submit">บันทึกรหัสผ่านใหม่</button></form><div class="auth-status${isError?' error':''}" id="resetStatus" role="status">${esc(message)}</div></div></div>`;
  document.getElementById('resetPasswordForm').onsubmit=async e=>{
    e.preventDefault();const form=e.target, status=document.getElementById('resetStatus');
    const password=form.elements.password.value;
    if(password!==form.elements.confirm.value){status.textContent='รหัสผ่านทั้งสองช่องไม่ตรงกัน';status.classList.add('error');return}
    const button=form.querySelector('button');button.disabled=true;status.textContent='กำลังบันทึก…';
    try{
      const {data:{session},error:sessionError}=await glurSupabase.auth.getSession();
      if(sessionError||!session)throw new Error('ลิงก์กู้คืนหมดอายุหรือไม่ถูกต้อง กรุณาขอลิงก์ใหม่');
      const {error}=await glurSupabase.auth.updateUser({password});
      if(error)throw error;
      await glurSupabase.auth.signOut();
      recoveryMode=false;history.replaceState(null,'',location.pathname+location.search);
      authScreen('ตั้งรหัสผ่านใหม่สำเร็จ เข้าสู่ระบบด้วย ID owner001 และรหัสผ่านใหม่ได้เลย');
    }catch(err){status.textContent=err.message||'ตั้งรหัสผ่านไม่สำเร็จ';status.classList.add('error')}
    finally{button.disabled=false}
  };
}
function showForgotPassword(){
  document.getElementById('glurAccount').classList.add('hidden');
  document.getElementById('nav').classList.add('hidden');
  document.getElementById('app').innerHTML=`<div class="auth-screen"><div class="card"><h2>ลืมรหัสผ่าน</h2><div class="small muted">สำหรับเจ้าของบัญชีที่มีอีเมลกู้คืนเท่านั้น</div><form id="forgotForm" class="stack"><div class="field"><label>อีเมลที่ผูกกับบัญชี Supabase</label><input name="email" type="email" autocomplete="email" required></div><button class="btn full" type="submit">ส่งลิงก์ตั้งรหัสผ่านใหม่</button></form><div class="auth-status" id="forgotStatus" role="status"></div><button class="btn secondary full" id="backLogin" type="button">กลับหน้าเข้าสู่ระบบ</button><div class="hint">หากขึ้น email rate limit exceeded ให้รอโควตาส่งอีเมลรีเซ็ต ห้ามกดซ้ำต่อเนื่อง</div></div></div>`;
  document.getElementById('backLogin').onclick=()=>authScreen();
  document.getElementById('forgotForm').onsubmit=async e=>{
    e.preventDefault();const form=e.target,button=form.querySelector('button'),status=document.getElementById('forgotStatus');
    button.disabled=true;status.textContent='กำลังส่งลิงก์…';status.classList.remove('error');
    try{
      const {error}=await glurSupabase.auth.resetPasswordForEmail(form.elements.email.value.trim(),{
        redirectTo:'https://demo78910.github.io/Glur-Bar/'
      });
      if(error)throw error;
      status.textContent='ส่งคำขอแล้ว หากอีเมลนี้มีบัญชีอยู่ กรุณาตรวจกล่องจดหมายและโฟลเดอร์สแปม';
    }catch(err){status.textContent=err.message||'ส่งอีเมลไม่สำเร็จ';status.classList.add('error')}
    finally{button.disabled=false}
  };
}
function authScreen(message='',isError=false){
  document.getElementById('glurAccount').classList.add('hidden');
  document.getElementById('nav').classList.add('hidden');
  document.getElementById('app').innerHTML=`<div class="auth-screen"><div class="card"><h2>เข้าสู่ระบบ GLUR BAR</h2><div class="small muted">STAFF LOGIN · เข้าสู่ระบบด้วย ID และรหัสผ่าน</div><form id="authForm" class="stack"><div class="field"><label>ID ผู้ใช้งาน</label><input name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" pattern="[a-z0-9_]{3,30}" required></div><div class="field"><label>รหัสผ่าน</label><input name="password" type="password" autocomplete="current-password" required></div><button id="authSubmit" type="submit" class="btn full">เข้าสู่ระบบ</button></form><button class="btn secondary full" id="forgotPasswordBtn" type="button" style="margin-top:8px">ลืมรหัสผ่าน / ตั้งรหัสผ่านใหม่</button><div id="authStatus" class="auth-status${isError?' error':''}" role="status">${esc(message)}</div><div class="hint">เจ้าของร้านเป็นผู้สร้างบัญชีพนักงาน ไม่มีการสมัครสมาชิกเอง · สต๊อกใช้ Supabase ออนไลน์ ส่วนสูตรและยอดขายเดิมยังอยู่ในเบราว์เซอร์</div></div></div>`;
  document.getElementById('forgotPasswordBtn').onclick=showForgotPassword;
  document.getElementById('authForm').onsubmit=async e=>{
    e.preventDefault();
    const button=document.getElementById('authSubmit');
    const status=document.getElementById('authStatus');
    button.disabled=true;status.textContent='กำลังเข้าสู่ระบบ…';status.classList.remove('error');
    try{
      const d=new FormData(e.target);
      const username=String(d.get('username')||'').trim().toLowerCase();
      const password=String(d.get('password')||'');
      const response=await fetch(SUPABASE_URL+'/functions/v1/glur-login',{
        method:'POST',
        headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY},
        body:JSON.stringify({username,password})
      });
      const result=await response.json();
      if(!response.ok||!result.access_token||!result.refresh_token){
        throw new Error(response.status===401?'ID หรือรหัสผ่านไม่ถูกต้อง':(result.error||'ไม่สามารถเข้าสู่ระบบได้'));
      }
      const {data,error}=await glurSupabase.auth.setSession({
        access_token:result.access_token,
        refresh_token:result.refresh_token
      });
      if(error||!data.user)throw new Error(error?.message||'ไม่สามารถเริ่มเซสชันได้');
      showAuthenticated(data.user);
    }catch(err){status.textContent=err.message||'เกิดข้อผิดพลาดในการเข้าสู่ระบบ';status.classList.add('error')}
    finally{button.disabled=false}
  };
}
let glurAccountLookupSerial=0;
async function updateGlurAccount(user){
  const serial=++glurAccountLookupSerial;
  const el=document.getElementById('glurAccountText');
  if(!el)return;
  el.textContent='กำลังโหลดชื่อผู้ใช้งาน…';
  try{
    const {data,error}=await glurSupabase.rpc('glur_my_employee_identity',{p_shop_id:GLUR_SHOP_ID});
    if(serial!==glurAccountLookupSerial||currentUser?.id!==user.id)return;
    if(error)throw error;
    const identity=Array.isArray(data)?data[0]:data;
    const name=String(identity?.display_name||identity?.username||'ผู้ใช้งาน').trim();
    const role=String(identity?.role||'ผู้ใช้งาน').trim();
    el.textContent=name+' · '+role;
  }catch(e){
    if(serial===glurAccountLookupSerial&&currentUser?.id===user.id){
      el.textContent='ไม่สามารถโหลดชื่อผู้ใช้งาน';
      console.warn('GLUR BAR: employee identity lookup failed',e);
    }
  }
}
async function glurLogout(){
  const out=document.getElementById('glurLogout');out.disabled=true;out.textContent='กำลังออก…';
  try{
    const {error}=await glurSupabase.auth.signOut();
    if(error)throw error;

async function glurLoadCostCatalog(){

 glurSupabase.from('glur_cost_catalog').select('id,name,unit,purchase_price,package_size').eq('shop_id',GLUR_SHOP_ID).order('name'),
 glurSupabase.from('glur_cost_catalog_history').select('id,catalog_id,effective_date,purchase_price,package_size').eq('shop_id',GLUR_SHOP_ID).order('effective_date',{ascending:false})
 ]);
 if(error){console.warn('Cost catalog:',error.message);return}glurCostCatalog=data||[];
 glurCostHistory=history||[];if(herror)console.warn('Cost history:',herror.message);
}
function glurCostMatch(name,unit){return glurCostCatalog.find(x=>x.name.trim().toLocaleLowerCase()===name.trim().toLocaleLowerCase()&&x.unit.trim().toLocaleLowerCase()===unit.trim().toLocaleLowerCase())}
function glurEffectiveCost(c,date){
 if(!c)return null;
 const day=date||glurLocalDate();
 const records=glurCostHistory.filter(h=>h.catalog_id===c.id&&h.effective_date<=day).sort((a,b)=>b.effective_date.localeCompare(a.effective_date));
 if(records.length)return records[0].package_size>0?records[0]:null;
 if(glurCostHistory.some(h=>h.catalog_id===c.id))return null;
 return num(c.package_size)>0?c:null;
}
function glurNonstockCost(i,date){const c=glurCostMatch(String(i.name||''),String(i.unit||''));const v=c?glurEffectiveCost(c,date):i;return v&&num(v.package_size)>0?num(v.purchase_price)/num(v.package_size)*num(i.quantity):0}
async function glurAddCostVersion(c,price,size,date){
 if(!c?.id)throw Error('ไม่พบวัตถุดิบในคลัง');
 if(!/^\\d{4}-\\d{2}-\\d{2}$/.test(date))throw Error('กรุณาระบุวันที่มีผล');
 if(price!==null&&(!Number.isFinite(price)||price<0||!Number.isFinite(size)||size<=0))throw Error('ราคาและขนาดบรรจุไม่ถูกต้อง');
 const {error}=await glurSupabase.from('glur_cost_catalog_history').upsert({shop_id:GLUR_SHOP_ID,catalog_id:c.id,effective_date:date,purchase_price:price,package_size:price===null?null:size},{onConflict:'catalog_id,effective_date'});
 if(error)throw error;await glurLoadCostCatalog();
}

let cloudReceipts=[],receiptsReady=false,receiptsError='',receivingBusy=false;
async function loadCloudReceipts(){
  receiptsError='';
  const {data,error}=await glurSupabase.from('glur_stock_receipts')
    .select('id,shop_id,stock_id,quantity,total_cost,received_at,created_by,created_at')
    .eq('shop_id',GLUR_SHOP_ID).order('received_at',{ascending:false}).limit(100);
  if(error){receiptsError=error.message;receiptsReady=false}
  else{cloudReceipts=data||[];receiptsReady=true}
  if(currentUser&&page==='receiving')renderReceiving();
}

async function glurManageUsers(action,params={}){
  const {data:{session},error:sessionError}=await glurSupabase.auth.getSession();
  if(sessionError||!session?.access_token)throw Error('กรุณาเข้าสู่ระบบใหม่');
  const response=await fetch(SUPABASE_URL+'/functions/v1/glur-manage-users',{
    method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY,'Authorization':'Bearer '+session.access_token},
    body:JSON.stringify({action,shop_id:GLUR_SHOP_ID,...params})
  });
  const result=await response.json().catch(()=>({}));
  if(!response.ok||result.error)throw Error(result.error||'HTTP '+response.status);
  return result;
}

let glurFinanceRows=[],glurFinanceError='',glurFinanceLoading=false,glurFinanceReady=false;
async function glurLoadFinance(){
 if(!currentUser||glurFinanceLoading)return;
 glurFinanceLoading=true;glurFinanceError='';
 try{
  const rows=[];const batch=500;
  for(let offset=0;offset<50000;offset+=batch){
   const {data,error}=await glurSupabase.from('glur_sales')
    .select('id,sold_at,created_at,total_amount,total_cost,quantity_sold,recipe_name')
    .eq('shop_id',GLUR_SHOP_ID).order('sold_at',{ascending:false})
    .range(offset,offset+batch-1);
   if(error)throw error;
   rows.push(...(data||[]));if(!data||data.length<batch)break;
   if(offset+batch>=50000)throw Error('ยอดขายเกินขีดจำกัดการโหลด กรุณาเพิ่มระบบรายงานแบบแบ่งช่วงวันที่');
  }
  glurFinanceRows=rows;glurFinanceReady=true;
 }catch(e){glurFinanceError=e.message||String(e);glurFinanceReady=false}
 finally{glurFinanceLoading=false;if(currentUser&&page==='dashboard')renderDashboard();if(currentUser&&page==='reports')renderReports()}
}
function glurFinanceMonth(m){return glurFinanceRows.filter(x=>{

})}
function glurFinanceStats(m){const rows=glurFinanceMonth(m);return {
 rows,revenue:sum(rows,x=>num(x.total_amount)),cost:sum(rows,x=>num(x.total_cost)),

}}

 '<div class="hint">ยอดขายและต้นทุนมาจาก Supabase · ค่าใช้จ่ายอื่นยังมาจากเบราว์เซอร์เครื่องนี้ จึงไม่ใช่กำไรสุทธิรวมทุกเครื่อง</div>'}

  pbBusy=true;const btn=f.querySelector('[type=submit]');btn.disabled=true;

async function pbDeleteRecipe(r){
 if(!glurCanAdjust()||pbBusy)return;

 if(typed===null)return;
 if(typed!=='DELETE'){toast('ยกเลิก: คำยืนยันไม่ถูกต้อง');return}
 if(!confirm('ยืนยันลบสูตร '+r.name+' อย่างถาวร?'))return;
 pbBusy=true;
 try{
  const {error}=await glurSupabase.rpc('glur_delete_prebatch_recipe',{p_recipe_id:r.id});

 }catch(err){toast('ลบสูตรไม่ได้: '+(err.message||err))}finally{pbBusy=false}
}

function glurThaiBusinessToday(){
 const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Bangkok',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',hourCycle:'h23'}).formatToParts(new Date());
 const get=k=>parts.find(x=>x.type===k)?.value;
 const d=new Date(Date.UTC(+get('year'),+get('month')-1,+get('day')));
 if(+get('hour')<3)d.setUTCDate(d.getUTCDate()-1);
 return d.toISOString().slice(0,10);
}
function glurPreviousBusinessDay(){const d=new Date(glurThaiBusinessToday()+'T00:00:00Z');d.setUTCDate(d.getUTCDate()-1);return d.toISOString().slice(0,10)}
function glurMoneySafe(v){return money(Number(v)||0)}
function glurProfitMonthDates(m){if(!/^\d{4}-\d{2}$/.test(m))throw Error('เดือนที่เลือกไม่ถูกต้อง');const [y,mon]=m.split('-').map(Number);if(mon<1||mon>12)throw Error('เดือนที่เลือกไม่ถูกต้อง');return [m+'-01',new Date(Date.UTC(y,mon,0)).toISOString().slice(0,10)]}

function glurFinStockCategory(name){
 const n=String(name||'').replace(/^TEST DEMO\s*[·:]\s*/i,'').replace(/^TEST\s+/i,'').toLowerCase().trim();
 if(/ginger|mint|rosemary|pandan|lemongrass|kaffir|herb|ใบเตย|ตะไคร้|ขิง|สะระแหน่/.test(n))return 'สมุนไพร';
 if(/cucumber|passion fruit pulp|orange(?! juice)|lemon(?! juice)|lime(?! juice)|แตงกวา|เสาวรส|ส้ม|มะนาว|เลมอน/.test(n))return 'ผลไม้ / ผักสด';
 if(/monin|syrup|ไซรัป|น้ำเชื่อม|cream soda/.test(n))return 'ไซรัป / น้ำเชื่อม';
 if(/peachtree|midori|campari|cinzano|d.o.m|de kuyper|triple sec|liqueur|vermouth/.test(n))return 'ลิเคียวร์ / เวอร์มุธ';
 if(/juice|cranberry|tipco|doi kham|apple|guava|น้ำผลไม้|โซดา|tonic/.test(n))return 'น้ำผลไม้ / มิกเซอร์';
 if(/vodka|kulov|absolut|silver wolf/.test(n))return 'สุราหลัก · Vodka';
 if(/gin|tanqueray|roku|roul|gilbey/.test(n))return 'สุราหลัก · Gin';
 if(/rum|chalong bay|havana|bacardi|dead man/.test(n))return 'สุราหลัก · Rum';
 if(/whisky|whiskey|bourbon|jim beam|jameson/.test(n))return 'สุราหลัก · Whisky';
 if(/818 blanco|818 reposado|tequila/.test(n))return 'สุราหลัก · Tequila';
 if(/mekhong|sangsom/.test(n))return 'สุราหลัก · สุราไทย';
 return 'วัตถุดิบอื่น ๆ';
}

async function glurUsageLoad(month){
 if(GLUR_SHOP_ID!==GLUR_TEST_SHOP_ID)throw Error('รายงานนี้อยู่ใน TEST เท่านั้น');
 if(!/^\d{4}-\d{2}$/.test(month))throw Error('เดือนที่เลือกไม่ถูกต้อง');
 glurUsageMonth=month;glurUsageBusy=true;glurUsageError='';render();
 try{
  const start=month+'-01',end=new Date(Date.UTC(Number(month.slice(0,4)),Number(month.slice(5,7)),1)).toISOString().slice(0,10);
  const [stocks,receipts,sales,closings]=await Promise.all([
   glurSupabase.from('glur_stock').select('id,name,unit,quantity,category,subcategory').eq('shop_id',GLUR_SHOP_ID).limit(1000),
   glurSupabase.from('glur_stock_receipts').select('stock_id,quantity,received_at').eq('shop_id',GLUR_SHOP_ID).gte('received_at',start+'T00:00:00+07:00').lt('received_at',end+'T00:00:00+07:00').limit(10000),
   glurSupabase.from('glur_sales').select('id,sold_at,quantity_sold,note').eq('shop_id',GLUR_SHOP_ID).gte('sold_at',start+'T00:00:00+07:00').lt('sold_at',end+'T00:00:00+07:00').limit(10000),
   glurSupabase.from('glur_daily_closings').select('id,business_date,session_no').eq('shop_id',GLUR_SHOP_ID).gte('business_date',start).lt('business_date',end).limit(1000)
  ]);
  for(const result of [stocks,receipts,sales,closings])if(result.error)throw result.error;
  const ids=(sales.data||[]).map(x=>x.id),closingIds=(closings.data||[]).map(x=>x.id);
  let ingredients=[],snapshots=[];
  for(let i=0;i<ids.length;i+=150){const result=await glurSupabase.from('glur_sale_ingredients').select('sale_id,stock_id,quantity_used').in('sale_id',ids.slice(i,i+150)).limit(10000);if(result.error)throw result.error;ingredients.push(...(result.data||[]))}
  for(let i=0;i<closingIds.length;i+=150){const result=await glurSupabase.from('glur_test_closing_stock_snapshots').select('closing_id,stock_id,quantity').in('closing_id',closingIds.slice(i,i+150)).limit(10000);if(result.error)throw result.error;snapshots.push(...(result.data||[]))}
  const saleMap=new Map((sales.data||[]).map(x=>[x.id,x]));
  const usage=new Map(),received=new Map();
  for(const row of ingredients){const sale=saleMap.get(row.sale_id);if(!sale)continue;const k=row.stock_id;usage.set(k,(usage.get(k)||0)+Number(row.quantity_used||0))}
  for(const row of receipts.data||[])received.set(row.stock_id,(received.get(row.stock_id)||0)+Number(row.quantity||0));
  const byClosing=new Map((closings.data||[]).map(x=>[x.id,x]));
  const sorted=(closings.data||[]).slice().sort((a,b)=>a.business_date.localeCompare(b.business_date)||Number(a.session_no)-Number(b.session_no));
  const first=sorted[0],last=sorted[sorted.length-1];
  const snapshotMap=id=>new Map(snapshots.filter(x=>x.closing_id===id).map(x=>[x.stock_id,Number(x.quantity)]));
  const opening=first?snapshotMap(first.id):new Map(),ending=last?snapshotMap(last.id):new Map();
  const rows=(stocks.data||[]).map(x=>({name:x.name,unit:x.unit,category:glurFinStockCategory(x.name),sold:usage.get(x.id)||0,received:received.get(x.id)||0,opening:opening.has(x.id)?opening.get(x.id):null,ending:ending.has(x.id)?ending.get(x.id):null}));
  rows.sort((a,b)=>a.category.localeCompare(b.category,'th')||a.name.localeCompare(b.name,'th'));
  glurUsageData={rows,month,start,end,first:first?.business_date||'',last:last?.business_date||'',salesCount:ids.length,trackedSales:new Set(ingredients.map(x=>x.sale_id)).size,simulatedSales:(sales.data||[]).filter(x=>String(x.note||'').startsWith('GLUR_SIM_30DAY_')).length,receiptCount:(receipts.data||[]).length,closingCount:sorted.length};
 }catch(e){glurUsageError=e.message||String(e);glurUsageData=null}
 finally{glurUsageBusy=false;render()}
}

function glurMonthlyExportCSV(){
 const d=glurMonthlyData;if(!d)return;
 const month=d.month||glurMonthlySelected||'';
 const sheets=glurMonthlyWorkbookSheets(d);
 // CSV is a single rectangular table. Section names are values, not incompatible headers.
 const rows=[['เดือน','หมวดรายงาน','รายการ','ตัวชี้วัด','ค่า','หน่วย']];
 const put=(group,item,metric,value,unit)=>rows.push([month,group,item,metric,value??'',unit]);
 const s=d.summary||{};
 [['ยอดขายทั้งหมด',s.revenue,'บาท'],['ต้นทุนเครื่องดื่ม',s.cogs,'บาท'],['กำไรขั้นต้น',Number(s.revenue||0)-Number(s.cogs||0),'บาท'],['ค่าใช้จ่ายที่บันทึก',s.expenses,'บาท'],['กำไรหลังหักค่าใช้จ่ายที่บันทึก',Number(s.revenue||0)-Number(s.cogs||0)-Number(s.expenses||0),'บาท'],['จำนวนแก้ว',s.drinks,'แก้ว'],['จำนวนรายการขาย',s.transactions,'รายการ']].forEach(x=>put('ภาพรวม','ทั้งร้าน',...x));
 (d.menus||[]).forEach(x=>{put('เมนูขายออก',x.menu_name,'จำนวนแก้ว',x.drinks,'แก้ว');put('เมนูขายออก',x.menu_name,'ยอดขาย',x.revenue,'บาท');put('เมนูขายออก',x.menu_name,'ต้นทุน',x.cost,'บาท')});
 (d.ingredients||[]).forEach(x=>{put('วัตถุดิบที่ใช้',x.stock_name,'ใช้จากการขาย',x.used_quantity,x.unit||'');put('วัตถุดิบที่ใช้',x.stock_name,'ต้นทุน',x.ingredient_cost,'บาท')});
 (d.stock||[]).forEach(x=>{[['รับเข้า',x.received_quantity],['ใช้จากการขาย',x.sold_usage_quantity],['ของเสีย',x.waste_quantity],['คงเหลือปัจจุบัน (ไม่ใช่สิ้นเดือน)',x.current_quantity]].forEach(y=>put('สต็อก',x.stock_name,y[0],y[1],x.unit||''))});
 (d.receipts||[]).forEach(x=>{put('รับสินค้า',x.stock_name,'ปริมาณรับเข้า',x.quantity,x.unit||'');put('รับสินค้า',x.stock_name,'มูลค่ารับเข้า',x.total_cost,'บาท')});
 glurMonthlySaveCSV('GLUR_Monthly_Data_'+month+'.csv',rows);
}
function glurMonthlyExportExcel(){
 const d=glurMonthlyData;if(!d)return;
 if(typeof XLSX==='undefined'){toast('ยังโหลดตัวสร้าง Excel ไม่สำเร็จ กรุณาตรวจอินเทอร์เน็ต หรือใช้ CSV');return}
 const wb=XLSX.utils.book_new();
 glurMonthlyWorkbookSheets(d).forEach(section=>{
  const ws=XLSX.utils.aoa_to_sheet(section.rows);
  const maxCols=Math.max(...section.rows.map(r=>r.length));
  ws['!cols']=Array.from({length:maxCols},(_,j)=>({wch:j===0?42:j===1?22:24}));
  const headerIndex=section.headerRow-1;
  const lastIndex=section.rows.length-1;
  if(lastIndex>headerIndex)ws['!autofilter']={ref:XLSX.utils.encode_range({s:{r:headerIndex,c:0},e:{r:lastIndex,c:maxCols-1}})};
  for(let ri=headerIndex+1;ri<section.rows.length;ri++)for(let ci=0;ci<section.rows[ri].length;ci++){
   const addr=XLSX.utils.encode_cell({r:ri,c:ci});const cell=ws[addr];
   if(cell&&cell.t==='n')cell.z=section.name==='01 ภาพรวม'&&ci===1?'#,##0.00;[Red](#,##0.00)':'#,##0.###;[Red](#,##0.###)';
  }
  XLSX.utils.book_append_sheet(wb,ws,section.name);
 });
 XLSX.writeFile(wb,'GLUR_Monthly_Report_'+(d.month||glurMonthlySelected)+'.xlsx');
}

 async function verifyTestOwner(){
  const {data:auth,error:authError}=await glurSupabase.auth.getUser();
  if(authError||!auth?.user)throw Error('ไม่พบเซสชันเข้าสู่ระบบ กรุณาเข้าสู่ระบบใหม่');
  const {data,error}=await glurSupabase.from('glur_members').select('role')
    .eq('shop_id',GLUR_TEST_SHOP_ID).eq('user_id',auth.user.id).limit(1);
  if(error)throw error;
  if(!data?.some(m=>m.role==='owner'))throw Error('เฉพาะ Owner ของร้าน TEST เท่านั้นที่ปลดล็อกได้');
 }
 function syncTestLock(){
  unlockBtn.style.display=isTest()&&currentUser?'inline-block':'none';
  unlockBtn.textContent=testUnlocked?'🔒 ล็อกเมนู TEST':'🔓 ปลดล็อกเมนู TEST (Owner)';
  const nav=document.getElementById('nav');
  nav.querySelectorAll('button[data-page]').forEach(btn=>{
   if(blockedInTest.has(btn.dataset.page))btn.style.display=isTest()&&!testUnlocked?'none':'';
  });
 }
 unlockBtn.addEventListener('click',async()=>{
  if(!isTest())return;
  if(testUnlocked){testUnlocked=false;syncTestLock();toast('ล็อกเมนู TEST แล้ว');return}
  unlockBtn.disabled=true;
  try{
   await verifyTestOwner();
   if(!confirm('ปลดล็อกเมนูที่ยังไม่ผ่านการตรวจสอบ RPC ใน TEST?\n\nคำเตือน: การปลดล็อกนี้เปิดเพียงหน้าเมนู ไม่ได้รับประกันว่าฟังก์ชันฐานข้อมูลจะแยก TEST/LIVE ถูกต้อง และอาจกระทบข้อมูล LIVE ได้\n\nต้องการยืนยันหรือไม่?'))return;
   testUnlocked=true;syncTestLock();toast('ปลดล็อกเมนู TEST สำหรับการทดลองครั้งนี้แล้ว');
  }catch(e){alert('ปลดล็อกไม่ได้: '+(e.message||e))}
  finally{unlockBtn.disabled=false}
 });
 setPage=function(p){
  if(isTest()&&blockedInTest.has(p)&&!testUnlocked){
   toast('เมนูนี้ล็อกใน TEST: RPC ยังไม่ผ่านการตรวจสอบ เจ้าของร้านสามารถกดปลดล็อกที่แถบ TEST ได้');return;
  }
  previousSetPage(p);
 };
 const nav=document.getElementById('nav');
 const observer=new MutationObserver(syncTestLock);
 observer.observe(nav,{childList:true,subtree:true,attributes:false});
 const oldShowAuth=showAuthenticated;
 showAuthenticated=function(user){oldShowAuth(user);syncTestLock()};
 syncTestLock();
 paint();
})();
</script>

<script>
/* GLUR BAR: visibility/access layer. Database RLS/RPC remain the security boundary. */
(function(){
 const rules={stock:['stock_view','stock_create','stock_edit','stock_delete','stock_waste'],recipes:['recipes_view','recipes_create','recipes_edit','recipes_delete'],sales:['sales_create','sales_edit','sales_cancel'],receiving:['receiving_manage'],costs:['expenses_manage'],reports:['reports_view'],profit:['costs_view'],closing:['closing_manage'],'closing-report':['reports_view'],team:['employees_edit','employees_permissions'],audit:['audit_view'],'activity-audit':['audit_view']};
 let ready=false;
 const has=k=>glurAdjustRole==='owner'||(ready&&glurMyPermissions?.[k]===true);
 const can=p=>!rules[p]||(!ready&&glurAdjustRole!=='owner')||rules[p].some(has);
 const hide=(el,yes)=>{if(el){el.classList.toggle('hidden',yes);if(yes)el.style.setProperty('display','none','important');else el.style.removeProperty('display')}};
 function apply(){
  if(!currentUser)return;
  document.querySelectorAll('#nav button[data-page]').forEach(b=>{const p=b.dataset.page;if(rules[p])hide(b,!can(p))});
  document.querySelectorAll('#nav .nav-group').forEach(g=>{let n=g.nextElementSibling,visible=false;while(n&&!n.classList.contains('nav-group')){if(n.matches('button[data-page]')&&getComputedStyle(n).display!=='none')visible=true;n=n.nextElementSibling}hide(g,!visible)});
  if(!can(page)){const old=page;page='dashboard';document.querySelectorAll('#nav button[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page==='dashboard'));if(old!=='dashboard')render();return}
  if(page==='stock'||page==='recipes'){
   const area=document.getElementById('app');if(!area)return;
   const selectorMap={stock:{stock_create:['#stockAdd','#stockNew','#stockCreate','[data-stock-create]'],stock_edit:['#stockEdit','[data-stock-edit]'],stock_delete:['#stockDelete','[data-stock-delete]'],stock_waste:['[data-stock-waste]']},recipes:{recipes_create:['#recipeNew','#recipeAdd','#recipeForm','#cloudRecipeForm'],recipes_edit:['#recipeEdit','[data-recipe-edit]'],recipes_delete:['#recipePermanentDelete','[data-recipe-delete]']}};
   for(const [key,selectors] of Object.entries(selectorMap[page]))for(const sel of selectors)area.querySelectorAll(sel).forEach(el=>hide(el,!has(key)));
  }
 }
 const oldSet=setPage;
 setPage=function(p){if(!can(p)){toast('บัญชีนี้ไม่ได้รับสิทธิ์เข้าหน้านี้');return}oldSet(p);apply()};
 const oldRender=render;
 render=function(){if(!can(page)){page='dashboard'}oldRender();document.querySelectorAll('#nav button[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));apply()};
 const oldLoad=glurLoadMyPermissions;
 glurLoadMyPermissions=async function(){ready=false;try{await oldLoad()}finally{ready=true;apply()}};
 const oldAuth=showAuthenticated;
 showAuthenticated=function(u){ready=false;oldAuth(u);apply()};
 // Recheck on tab return; avoid showing privileged controls after a role change.
 document.addEventListener('visibilitychange',()=>{if(!document.hidden&&currentUser)glurLoadMyPermissions()});
 window.glurApplyPermissionVisibility=apply;
})();

// Stable navigation: URL hash is the source of truth; restore after async access loads.
(function(){
 const key=()=> 'glur_last_page_'+(GLUR_SHOP_ID===GLUR_TEST_SHOP_ID?'TEST':'LIVE');
 const valid=p=>typeof p==='string'&&/^[a-z][a-z0-9-]{0,48}$/.test(p);
 const hashPage=()=>{const m=location.hash.match(/^#page=([a-z][a-z0-9-]{0,48})$/);return m?m[1]:''};
 let pending='',restoring=false,loginUser='';
 const save=p=>{
  if(!valid(p))return;
  sessionStorage.setItem(key(),p);
  if(location.hash!=='#page='+p)history.replaceState(null,'',location.pathname+location.search+'#page='+p);
 };
 const previousSet=setPage;
 setPage=function(p){
  previousSet(p);
  if(!restoring&&currentUser&&page===p)save(p);
 };
 const restore=()=>{
  if(!pending||!currentUser||!glurAdjustRole)return;
  const desired=pending;
  if(typeof glurRoleAllowed==='function'&&!glurRoleAllowed(desired)){pending='';return}
  if(['profit','closing-report'].includes(desired)&&typeof glurCanAdjust==='function'&&!glurCanAdjust())return;
  restoring=true;
  previousSet(desired);
  restoring=false;
  if(page===desired){pending='';save(desired)}
 };
 const priorAccess=glurLoadAdjustmentAccess;
 glurLoadAdjustmentAccess=async function(...args){
  const result=await priorAccess.apply(this,args);
  restore();return result;
 };
 const priorPermissions=glurLoadMyPermissions;
 glurLoadMyPermissions=async function(...args){
  const result=await priorPermissions.apply(this,args);
  restore();return result;
 };
 const priorAuth=showAuthenticated;
 showAuthenticated=function(u){
  const newLogin=loginUser!==u.id;
  loginUser=u.id;
  if(newLogin){const raw=decodeURIComponent(location.hash.slice(1));pending=hashPage()||(/^[a-z][a-z0-9-]{0,48}$/.test(raw)?raw:'')||sessionStorage.getItem(key())||localStorage.getItem('glur_last_page_'+u.id+'_'+GLUR_SHOP_ID)||'';}
  priorAuth(u);
  if(pending&&pending!=='dashboard')restore();
 };
 // A hard refresh must not rewrite the remembered destination to dashboard.
 window.addEventListener('pagehide',()=>{if(currentUser&&!pending&&valid(page))save(page)});
 window.addEventListener('hashchange',()=>{const target=hashPage();if(target&&currentUser){pending=target;restore()}});
})();

</script>
</body>
</html>

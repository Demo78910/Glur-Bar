<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101010">
<title>GLUR BAR — Stock & Sales</title>
<style>
:root{--bg:#101010;--panel:#1b1b1b;--panel2:#222;--gold:#d6b15e;--gold2:#f0d58b;--text:#f4f0e6;--muted:#aaa398;--line:#39352c;--red:#ff7777;--green:#9ad7a0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.top{padding:20px 16px 14px;background:linear-gradient(130deg,#1b1a16,#101010 75%);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}.brand{color:var(--gold2);font-size:22px;font-weight:800;letter-spacing:2px}.sub{color:var(--muted);font-size:12px;margin-top:2px}.wrap{max-width:900px;margin:auto;padding:16px 14px 100px}.page-title{font-size:22px;font-weight:750;margin:4px 0 14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;min-width:0}.metric-label{font-size:12px;color:var(--muted)}.metric{font-size:24px;color:var(--gold2);font-weight:750;margin-top:5px;overflow-wrap:anywhere}.section-title{font-size:16px;font-weight:700;margin:18px 0 10px}.muted{color:var(--muted)}.small{font-size:12px}.row{display:flex;align-items:center;gap:8px}.between{justify-content:space-between}.stack{display:flex;flex-direction:column;gap:9px}.field{display:flex;flex-direction:column;gap:5px;min-width:0;flex:1}.field label{font-size:12px;color:var(--muted)}input,select{width:100%;min-width:0;border:1px solid #4a4539;background:#121212;color:var(--text);border-radius:9px;padding:11px 10px;outline:none}input:focus,select:focus{border-color:var(--gold)}.btn{border:1px solid var(--gold);background:var(--gold);color:#17130b;font-weight:750;border-radius:10px;padding:11px 13px}.btn.secondary{background:transparent;color:var(--gold2)}.btn.danger{border-color:#793d3d;background:#3a1d1d;color:#ffb7b7}.btn.smallbtn{padding:7px 10px;font-size:12px}.full{width:100%}.nav{position:fixed;z-index:10;bottom:0;left:0;right:0;display:flex;overflow-x:auto;background:#151515;border-top:1px solid var(--line);padding:7px max(7px,env(safe-area-inset-right)) calc(7px + env(safe-area-inset-bottom)) max(7px,env(safe-area-inset-left));gap:4px}.nav button{flex:1;min-width:65px;border:0;background:transparent;color:var(--muted);padding:8px 5px;border-radius:9px;font-size:11px}.nav button span{display:block;font-size:18px;margin-bottom:3px}.nav button.active{color:var(--gold2);background:#30291b}.item{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid #302d27}.item:last-child{border-bottom:0}.item-name{font-weight:650;overflow-wrap:anywhere}.pill{display:inline-block;border:1px solid var(--line);border-radius:20px;padding:3px 8px;font-size:11px;color:var(--muted)}.warn{color:var(--red)}.good{color:var(--green)}.empty{padding:20px 8px;text-align:center;color:var(--muted)}.hidden{display:none!important}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.formgrid .wide{grid-column:1/-1}.ingredient-row{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(60px,.8fr) 38px;gap:6px;margin:7px 0}.ingredient-row input,.ingredient-row select{padding:9px 7px}.tableline{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid #302d27}.tableline:last-child{border-bottom:0}.toast{position:fixed;z-index:20;left:50%;bottom:88px;transform:translateX(-50%);background:#eee1bd;color:#17130b;padding:10px 16px;border-radius:20px;box-shadow:0 5px 24px #0008;max-width:90%;font-weight:650}.hint{border-left:3px solid var(--gold);padding:8px 10px;background:#211e17;border-radius:0 8px 8px 0;color:#d9cfb8;font-size:12px;margin:10px 0}.actions{display:flex;gap:7px;flex-wrap:wrap}@media(min-width:650px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.wrap{padding-top:22px}.formgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>
<header class="top"><div class="brand">GLUR BAR</div><div class="sub">STOCK · RECIPES · SALES · REPORTS</div></header>
<main class="wrap" id="app"></main>
<nav class="nav" id="nav">
<button data-page="dashboard" class="active"><span>⌂</span>ภาพรวม</button><button data-page="stock"><span>▤</span>สต๊อก</button><button data-page="recipes"><span>✧</span>สูตร</button><button data-page="sales"><span>＋</span>ขาย</button><button data-page="receiving"><span>⇩</span>รับเข้า</button><button data-page="costs"><span>฿</span>ค่าใช้จ่าย</button><button data-page="reports"><span>▥</span>รายงาน</button><button data-page="settings"><span>⚙</span>สำรอง</button>
</nav>
<div id="toast" class="toast hidden" role="status"></div>
<script>
'use strict';
// กรอก Project URL และ publishable/anon key ของ Supabase เท่านั้น (ห้ามใช้ service_role)
const SUPABASE_URL='https://zkicghxgfuybwfnwxlfg.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_rbvnWD6TtzMqjxhWi49ZjQ_IggouNp2';
const CLOUD_ROW='main';
const cloudReady=SUPABASE_URL.startsWith('https://') && !SUPABASE_ANON_KEY.startsWith('PASTE_');
const cloud=cloudReady && window.supabase ? window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY) : null;
let session=null,saveQueue=Promise.resolve(),saving=false;
const KEY='glurBarApp_v1';
const blank=()=>({stock:[],recipes:[],sales:[],receipts:[],expenses:[]});
let db=blank(),page='dashboard';
async function loadDB(){
 const {data,error}=await cloud.from('bar_data').select('data').eq('id',CLOUD_ROW).maybeSingle();
 if(error)throw error;
 db={...blank(),...(data?.data||{})};render();
}
function saveDB(){
 if(!cloud||!session){toast('ยังไม่ได้เชื่อมต่อ Cloud');return}
 const snapshot=JSON.parse(JSON.stringify(db));
 saving=true;
 saveQueue=saveQueue.catch(()=>{}).then(async()=>{
  const {error}=await cloud.from('bar_data').upsert({id:CLOUD_ROW,data:snapshot,updated_at:new Date().toISOString()},{onConflict:'id'});
  if(error)throw error;
 }).catch(err=>{console.error('Cloud save failed',err);toast('บันทึก Cloud ไม่สำเร็จ: '+err.message)}).finally(()=>{saving=false});
 return saveQueue;
}
function showLogin(message='เข้าสู่ระบบเพื่อใช้งานข้อมูลออนไลน์'){
 document.getElementById('nav').classList.add('hidden');
 document.getElementById('app').innerHTML=`<div class="page-title">GLUR BAR CLOUD</div><div class="card"><div class="hint">${esc(message)}</div><form id="loginForm" class="stack"><div class="field"><label>ชื่อผู้ใช้ (ID)</label><input name="username" autocomplete="username" required></div><div class="field"><label>รหัสผ่าน</label><input name="password" type="password" autocomplete="current-password" required></div><button class="btn full" type="submit">เข้าสู่ระบบ</button></form></div>`;
 document.getElementById('loginForm').onsubmit=async e=>{
  e.preventDefault();const f=new FormData(e.target),username=String(f.get('username')).trim().toLowerCase();
  if(!/^[a-z0-9_-]{3,32}$/.test(username)){toast('ID ต้องเป็น a-z, 0-9, _ หรือ - (3–32 ตัว)');return}
  const {error}=await cloud.auth.signInWithPassword({email:username+'@glurbar.invalid',password:String(f.get('password'))});
  if(error)toast('เข้าสู่ระบบไม่สำเร็จ: ตรวจสอบ ID และรหัสผ่าน');
 };
}
async function startCloud(){
 if(!cloud){document.getElementById('nav').classList.add('hidden');document.getElementById('app').innerHTML='<div class="card"><h3>ตั้งค่า Supabase ก่อนใช้งาน</h3><p>กรอก SUPABASE_URL และ SUPABASE_ANON_KEY ในไฟล์ index.html แล้วอัปโหลดขึ้น GitHub Pages</p></div>';return}
 const {data:{session:current}}=await cloud.auth.getSession();
 await onSession(current);
 cloud.auth.onAuthStateChange((event,next)=>{if(event==='SIGNED_IN'||event==='SIGNED_OUT')setTimeout(()=>onSession(next),0)});
}
async function onSession(next){
 session=next;
 if(!session){db=blank();showLogin();return}
 document.getElementById('nav').classList.remove('hidden');
 try{await loadDB()}catch(err){showLogin('อ่านข้อมูล Cloud ไม่สำเร็จ: '+err.message)}
}
async function logout(){await cloud.auth.signOut()}

function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(n){return new Intl.NumberFormat('th-TH',{style:'currency',currency:'THB',maximumFractionDigits:2}).format(Number(n)||0)}
function num(v){const n=Number(v);return Number.isFinite(n)?n:0}
function dateNow(){return new Date().toISOString().slice(0,10)}
function monthNow(){return dateNow().slice(0,7)}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.add('hidden'),2400)}
function setPage(p){page=p;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('button[data-page]');if(b)setPage(b.dataset.page)});
function stockById(sid){return db.stock.find(s=>s.id===sid)}
function recipeCost(r){return (r.ingredients||[]).reduce((sum,x)=>{const s=stockById(x.stockId);return sum+(s?num(x.qty)*num(s.cost):0)},0)}
function sum(arr,fn){return arr.reduce((a,x)=>a+fn(x),0)}
function monthSales(m){return db.sales.filter(s=>(s.date||'').slice(0,7)===m)}
function monthExpenses(m){return db.expenses.filter(x=>(x.date||'').slice(0,7)===m)}
function shell(title,body){document.getElementById('app').innerHTML=`<div class="page-title">${title}</div>${body}`}
function metric(label,value,sub=''){return `<div class="card"><div class="metric-label">${label}</div><div class="metric">${value}</div>${sub?`<div class="small muted">${sub}</div>`:''}</div>`}
function empty(msg){return `<div class="empty">${msg}</div>`}
function render(){const f={dashboard:renderDashboard,stock:renderStock,recipes:renderRecipes,sales:renderSales,receiving:renderReceiving,costs:renderCosts,reports:renderReports,settings:renderSettings};(f[page]||renderDashboard)()}
function renderDashboard(){const m=monthNow(),ss=monthSales(m),rev=sum(ss,s=>num(s.revenue)),cogs=sum(ss,s=>num(s.cost)),exp=sum(monthExpenses(m),x=>num(x.amount));shell('ภาพรวมร้าน',`<div class="muted small">${m} · สรุปข้อมูลเดือนปัจจุบัน</div><div class="grid" style="margin-top:12px">${metric('ยอดขายเดือนนี้',money(rev))}${metric('ต้นทุนสินค้าที่ขาย',money(cogs))}${metric('ค่าใช้จ่ายอื่น',money(exp))}${metric('กำไรหลังหักค่าใช้จ่าย',money(rev-cogs-exp))}</div><div class="section-title">สต๊อกใกล้หมด</div><div class="card">${(()=>{const low=db.stock.filter(s=>num(s.qty)<=num(s.low));return low.length?low.map(s=>`<div class="item"><div><div class="item-name">${esc(s.name)}</div><div class="small muted">เหลือ ${num(s.qty)} ${esc(s.unit)}</div></div><span class="pill warn">ใกล้หมด</span></div>`).join(''):empty('ยังไม่มีรายการสต๊อกที่ต่ำกว่าระดับแจ้งเตือน')})()}</div><div class="section-title">ทางลัด</div><div class="grid"><button class="btn secondary" onclick="setPage('stock')">＋ เพิ่มวัตถุดิบ</button><button class="btn secondary" onclick="setPage('recipes')">✧ สร้างสูตร</button><button class="btn secondary" onclick="setPage('sales')">＋ บันทึกยอดขาย</button><button class="btn secondary" onclick="setPage('receiving')">⇩ รับของเข้า</button></div><div class="hint">ข้อมูลบันทึกบน Supabase Cloud · เปิดจากหลายอุปกรณ์ได้เมื่อใช้บัญชีที่ได้รับอนุญาต</div>`)}
function renderStock(){shell('สต๊อกวัตถุดิบ',`<div class="card"><div class="section-title" style="margin-top:0">เพิ่มวัตถุดิบ</div><form id="stockForm" class="formgrid"><div class="field wide"><label>ชื่อวัตถุดิบ / สินค้า</label><input name="name" required placeholder="เช่น Tanqueray Gin" /></div><div class="field"><label>จำนวนเริ่มต้น</label><input name="qty" type="number" step="any" min="0" value="0" required /></div><div class="field"><label>หน่วยหลัก</label><select name="unit"><option value="ml">ml</option><option value="g">g</option><option value="ชิ้น">ชิ้น</option><option value="ขวด">ขวด</option><option value="ถุง">ถุง</option><option value="หน่วย">หน่วย</option></select></div><div class="field"><label>ต้นทุนต่อหน่วย (บาท)</label><input name="cost" type="number" step="any" min="0" value="0" required /></div><div class="field"><label>แจ้งเตือนเมื่อเหลือ</label><input name="low" type="number" step="any" min="0" value="0" /></div><div class="wide"><button class="btn full" type="submit">＋ บันทึกวัตถุดิบ</button></div></form></div><div class="section-title">รายการทั้งหมด (${db.stock.length})</div><div class="card">${db.stock.length?db.stock.map(s=>`<div class="item"><div style="min-width:0"><div class="item-name">${esc(s.name)}</div><div class="small muted">ต้นทุน ${money(s.cost)}/${esc(s.unit)} · แจ้งเตือนที่ ${num(s.low)} ${esc(s.unit)}</div><div class="${num(s.qty)<=num(s.low)?'warn':'good'}">คงเหลือ ${num(s.qty)} ${esc(s.unit)}</div></div><div class="actions"><button class="btn secondary smallbtn" onclick="editStock('${s.id}')">แก้ไข</button><button class="btn danger smallbtn" onclick="deleteStock('${s.id}')">ลบ</button></div></div>`).join(''):empty('ยังไม่มีวัตถุดิบ เพิ่มรายการแรกด้านบน')}</div>`);document.getElementById('stockForm').addEventListener('submit',e=>{e.preventDefault();const d=new FormData(e.target);db.stock.push({id:id(),name:String(d.get('name')).trim(),qty:num(d.get('qty')),unit:d.get('unit'),cost:num(d.get('cost')),low:num(d.get('low'))});saveDB();toast('เพิ่มวัตถุดิบแล้ว');renderStock()})}
function editStock(sid){const s=stockById(sid);if(!s)return;const name=prompt('ชื่อวัตถุดิบ',s.name);if(name===null)return;const qty=prompt(`จำนวนคงเหลือ (${s.unit})`,s.qty);if(qty===null)return;const cost=prompt(`ต้นทุนต่อ ${s.unit} (บาท)`,s.cost);if(cost===null)return;s.name=name.trim()||s.name;s.qty=Math.max(0,num(qty));s.cost=Math.max(0,num(cost));saveDB();renderStock();toast('แก้ไขแล้ว')}
function deleteStock(sid){if(db.recipes.some(r=>r.ingredients.some(i=>i.stockId===sid))){toast('วัตถุดิบนี้อยู่ในสูตร กรุณาแก้สูตรก่อนลบ');return}if(!confirm('ลบวัตถุดิบนี้หรือไม่?'))return;db.stock=db.stock.filter(s=>s.id!==sid);saveDB();renderStock()}
function renderRecipes(){shell('สูตรเครื่องดื่ม',`<div class="card"><div class="section-title" style="margin-top:0">สร้างสูตรใหม่</div>${db.stock.length?'':`<div class="hint">ต้องเพิ่มวัตถุดิบในเมนูสต๊อกก่อน จึงจะสร้างสูตรได้</div>`}<form id="recipeForm"><div class="field"><label>ชื่อเมนู</label><input name="name" required placeholder="เช่น Gin & Tonic" /></div><div class="formgrid" style="margin-top:9px"><div class="field"><label>ราคาขาย (บาท)</label><input name="price" type="number" min="0" step="any" required value="250" /></div><div class="field"><label>คำอธิบาย (ไม่บังคับ)</label><input name="note" placeholder="รสชาติ / แก้ว" /></div></div><div class="section-title">วัตถุดิบในสูตร</div><div id="ingredientRows"></div><button class="btn secondary full" type="button" id="addIngredient">＋ เพิ่มวัตถุดิบในสูตร</button><button class="btn full" style="margin-top:10px" type="submit" ${db.stock.length?'':'disabled'}>บันทึกสูตร</button></form></div><div class="section-title">สูตรที่บันทึกไว้ (${db.recipes.length})</div><div class="card">${db.recipes.length?db.recipes.map(r=>`<div class="item"><div style="min-width:0"><div class="item-name">${esc(r.name)}</div><div class="small muted">ขาย ${money(r.price)} · ต้นทุน ${money(recipeCost(r))}</div><div class="small muted">${(r.ingredients||[]).length} วัตถุดิบ · กำไรขั้นต้น ${money(num(r.price)-recipeCost(r))}</div></div><div class="actions"><button class="btn secondary smallbtn" onclick="editRecipe('${r.id}')">แก้ไข</button><button class="btn danger smallbtn" onclick="deleteRecipe('${r.id}')">ลบ</button></div></div>`).join(''):empty('ยังไม่มีสูตร')}</div>`);const rows=document.getElementById('ingredientRows');function addRow(sid='',qty=''){const div=document.createElement('div');div.className='ingredient-row';div.innerHTML=`<select aria-label="วัตถุดิบ"><option value="">เลือกวัตถุดิบ</option>${db.stock.map(s=>`<option value="${s.id}" ${s.id===sid?'selected':''}>${esc(s.name)} (${esc(s.unit)})</option>`).join('')}</select><input aria-label="ปริมาณ" type="number" step="any" min="0" placeholder="ปริมาณ" value="${esc(qty)}"><button type="button" class="btn danger smallbtn" aria-label="ลบแถว">×</button>`;div.querySelector('button').onclick=()=>div.remove();rows.appendChild(div)}addRow();document.getElementById('addIngredient').onclick=()=>addRow();document.getElementById('recipeForm').addEventListener('submit',e=>{e.preventDefault();const d=new FormData(e.target),ingredients=[...rows.children].map(el=>({stockId:el.children[0].value,qty:num(el.children[1].value)})).filter(x=>x.stockId&&x.qty>0);if(!ingredients.length){toast('เพิ่มวัตถุดิบอย่างน้อย 1 รายการ');return}db.recipes.push({id:id(),name:String(d.get('name')).trim(),price:num(d.get('price')),note:String(d.get('note')||''),ingredients});saveDB();toast('บันทึกสูตรแล้ว');renderRecipes()})}
function editRecipe(rid){const r=db.recipes.find(x=>x.id===rid);if(!r)return;const name=prompt('ชื่อเมนู',r.name);if(name===null)return;const price=prompt('ราคาขาย (บาท)',r.price);if(price===null)return;r.name=name.trim()||r.name;r.price=Math.max(0,num(price));saveDB();renderRecipes();toast('แก้ไขชื่อและราคาแล้ว')}
function deleteRecipe(rid){if(!confirm('ลบสูตรนี้หรือไม่?'))return;db.recipes=db.recipes.filter(r=>r.id!==rid);saveDB();renderRecipes()}
function renderSales(){shell('บันทึกยอดขาย',`<div class="card"><div class="section-title" style="margin-top:0">ขายเมนูจากสูตร</div>${db.recipes.length?'':empty('เพิ่มสูตรเครื่องดื่มก่อนเริ่มบันทึกขาย')}<form id="saleForm" class="stack"><div class="field"><label>เมนู</label><select name="recipe" required>${db.recipes.map(r=>`<option value="${r.id}">${esc(r.name)} — ${money(r.price)}</option>`).join('')}</select></div><div class="formgrid"><div class="field"><label>จำนวนแก้ว</label><input name="qty" type="number" min="1" step="1" value="1" required></div><div class="field"><label>วันที่ขาย</label><input name="date" type="date" value="${dateNow()}" required></div></div><div class="hint">ระบบจะตรวจสต๊อก ตัดวัตถุดิบตามสูตร และบันทึกยอดขายพร้อมต้นทุน ณ วันที่ขาย</div><button class="btn full" type="submit" ${db.recipes.length?'':'disabled'}>บันทึกการขายและตัดสต๊อก</button></form></div><div class="section-title">ประวัติการขายล่าสุด</div><div class="card">${db.sales.length?[...db.sales].reverse().slice(0,30).map(s=>`<div class="item"><div><div class="item-name">${esc(s.name)} × ${s.qty}</div><div class="small muted">${esc(s.date)} · ต้นทุน ${money(s.cost)}</div></div><strong>${money(s.revenue)}</strong></div>`).join(''):empty('ยังไม่มีรายการขาย')}</div>`);document.getElementById('saleForm').addEventListener('submit',e=>{e.preventDefault();const d=new FormData(e.target),r=db.recipes.find(x=>x.id===d.get('recipe')),qty=Math.max(1,Math.floor(num(d.get('qty'))));if(!r)return;for(const ing of r.ingredients){const s=stockById(ing.stockId),need=num(ing.qty)*qty;if(!s||num(s.qty)<need){toast(`สต๊อกไม่พอ: ${s?s.name:'วัตถุดิบถูกลบ'}`);return}}for(const ing of r.ingredients){const s=stockById(ing.stockId);s.qty=Number((num(s.qty)-num(ing.qty)*qty).toFixed(4))}db.sales.push({id:id(),date:d.get('date')||dateNow(),recipeId:r.id,name:r.name,qty,revenue:num(r.price)*qty,cost:recipeCost(r)*qty});saveDB();toast('บันทึกยอดขายและตัดสต๊อกแล้ว');renderSales()})}
function renderReceiving(){shell('รับวัตถุดิบเข้า',`<div class="card"><div class="section-title" style="margin-top:0">บันทึกรับเข้า</div>${db.stock.length?'':empty('เพิ่มวัตถุดิบในเมนูสต๊อกก่อน')}<form id="receiveForm" class="stack"><div class="field"><label>วัตถุดิบ</label><select name="stock" required>${db.stock.map(s=>`<option value="${s.id}">${esc(s.name)} (${esc(s.unit)})</option>`).join('')}</select></div><div class="formgrid"><div class="field"><label>จำนวนที่รับเข้า (หน่วยหลัก)</label><input name="qty" type="number" min="0.0001" step="any" required placeholder="เช่น 700" /></div><div class="field"><label>ราคารวมที่ซื้อ (บาท)</label><input name="cost" type="number" min="0" step="any" required placeholder="เช่น 749" /></div><div class="field"><label>วันที่รับเข้า</label><input name="date" type="date" value="${dateNow()}" required /></div></div><div class="hint">ต้นทุนต่อหน่วยจะคำนวณเป็นค่าเฉลี่ยถ่วงน้ำหนักจากสต๊อกเดิมและของที่รับเข้า</div><button class="btn full" type="submit" ${db.stock.length?'':'disabled'}>บันทึกรับเข้า</button></form></div><div class="section-title">ประวัติรับเข้า</div><div class="card">${db.receipts.length?[...db.receipts].reverse().slice(0,30).map(x=>`<div class="item"><div><div class="item-name">${esc(x.name)} +${x.qty} ${esc(x.unit)}</div><div class="small muted">${esc(x.date)} · ${money(x.cost)} รวม</div></div><strong>${money(x.unitCost)}/${esc(x.unit)}</strong></div>`).join(''):empty('ยังไม่มีรายการรับเข้า')}</div>`);document.getElementById('receiveForm').addEventListener('submit',e=>{e.preventDefault();const d=new FormData(e.target),s=stockById(d.get('stock')),qty=num(d.get('qty')),cost=num(d.get('cost'));if(!s||qty<=0)return;const oldQty=num(s.qty),newQty=oldQty+qty;s.cost=newQty>0?(oldQty*num(s.cost)+cost)/newQty:0;s.qty=newQty;db.receipts.push({id:id(),date:d.get('date')||dateNow(),stockId:s.id,name:s.name,unit:s.unit,qty,cost,unitCost:qty?cost/qty:0});saveDB();toast('รับวัตถุดิบเข้าแล้ว');renderReceiving()})}
function renderCosts(){shell('ค่าใช้จ่าย',`<div class="card"><div class="section-title" style="margin-top:0">เพิ่มค่าใช้จ่าย</div><form id="expenseForm" class="stack"><div class="field"><label>รายการ</label><input name="name" required placeholder="เช่น น้ำแข็ง / ค่าเดินทาง / อุปกรณ์" /></div><div class="formgrid"><div class="field"><label>จำนวนเงิน (บาท)</label><input name="amount" type="number" min="0" step="any" required /></div><div class="field"><label>วันที่</label><input name="date" type="date" value="${dateNow()}" required /></div></div><button class="btn full" type="submit">＋ บันทึกค่าใช้จ่าย</button></form></div><div class="section-title">รายการค่าใช้จ่าย</div><div class="card">${db.expenses.length?[...db.expenses].reverse().map(x=>`<div class="item"><div><div class="item-name">${esc(x.name)}</div><div class="small muted">${esc(x.date)}</div></div><div class="row"><strong>${money(x.amount)}</strong><button class="btn danger smallbtn" onclick="deleteExpense('${x.id}')">ลบ</button></div></div>`).join(''):empty('ยังไม่มีค่าใช้จ่าย')}</div>`);document.getElementById('expenseForm').addEventListener('submit',e=>{e.preventDefault();const d=new FormData(e.target);db.expenses.push({id:id(),name:String(d.get('name')).trim(),amount:num(d.get('amount')),date:d.get('date')||dateNow()});saveDB();toast('บันทึกค่าใช้จ่ายแล้ว');renderCosts()})}
function deleteExpense(eid){if(!confirm('ลบรายการนี้หรือไม่?'))return;db.expenses=db.expenses.filter(x=>x.id!==eid);saveDB();renderCosts()}
function renderReports(){const m=monthNow(),ss=monthSales(m),rev=sum(ss,s=>num(s.revenue)),cogs=sum(ss,s=>num(s.cost)),ex=monthExpenses(m),expenses=sum(ex,x=>num(x.amount));shell('รายงานประจำเดือน',`<div class="card"><div class="field"><label>เลือกเดือน</label><input type="month" id="reportMonth" value="${m}"></div><div id="reportData" style="margin-top:14px"></div><button class="btn secondary full" style="margin-top:12px" id="exportCSV">ส่งออกรายการขาย CSV</button></div><div class="section-title">หมายเหตุการคำนวณ</div><div class="hint">กำไรสุทธิในรายงานนี้ = ยอดขาย − ต้นทุนสูตรของรายการขาย − ค่าใช้จ่ายที่บันทึกไว้ ไม่รวมค่าใช้จ่ายที่ยังไม่ได้บันทึกหรือภาษี</div>`);function update(){const mm=document.getElementById('reportMonth').value, sales=monthSales(mm), exps=monthExpenses(mm),revenue=sum(sales,s=>num(s.revenue)),cost=sum(sales,s=>num(s.cost)),other=sum(exps,x=>num(x.amount));document.getElementById('reportData').innerHTML=`<div class="stack">${[['ยอดขาย',money(revenue)],['ต้นทุนสินค้าที่ขาย',money(cost)],['กำไรขั้นต้น',money(revenue-cost)],['ค่าใช้จ่ายอื่น',money(other)],['กำไรหลังหักค่าใช้จ่าย',money(revenue-cost-other)],['จำนวนรายการขาย',sales.length+' รายการ']].map(([a,b])=>`<div class="tableline"><span class="muted">${a}</span><strong>${b}</strong></div>`).join('')}</div><div class="section-title">ขายดีในเดือนนี้</div>${(()=>{const tally={};sales.forEach(s=>tally[s.name]=(tally[s.name]||0)+num(s.qty));const top=Object.entries(tally).sort((a,b)=>b[1]-a[1]).slice(0,5);return top.length?top.map(([n,q])=>`<div class="tableline"><span>${esc(n)}</span><strong>${q} แก้ว</strong></div>`).join(''):empty('ไม่มีรายการขายในเดือนนี้')})()}`};update();document.getElementById('reportMonth').addEventListener('change',update);document.getElementById('exportCSV').onclick=()=>{const mm=document.getElementById('reportMonth').value,sales=monthSales(mm),rows=[['date','menu','quantity','revenue_THB','cost_THB'],...sales.map(s=>[s.date,s.name,s.qty,s.revenue,s.cost])];const csv='\ufeff'+rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');downloadBlob(csv,`glur-bar-sales-${mm}.csv`,'text/csv;charset=utf-8;') }}
function renderSettings(){shell('สำรองและกู้คืนข้อมูล',`<div class="card"><div class="section-title" style="margin-top:0">ข้อมูลของ GLUR BAR</div><div class="grid">${metric('วัตถุดิบ',db.stock.length+' รายการ')}${metric('สูตร',db.recipes.length+' รายการ')}${metric('ยอดขาย',db.sales.length+' รายการ')}${metric('ค่าใช้จ่าย',db.expenses.length+' รายการ')}</div><div class="hint">ข้อมูลบันทึกบน Supabase Cloud แนะนำให้ดาวน์โหลดไฟล์สำรอง JSON เป็นระยะ</div><button id="backup" class="btn full">ดาวน์โหลดไฟล์สำรอง JSON</button><div class="section-title">กู้คืนข้อมูลจากไฟล์สำรอง</div><div class="field"><label>เลือกไฟล์ JSON ที่เคยสำรองไว้</label><input id="restoreFile" type="file" accept="application/json,.json"></div><button id="restore" class="btn secondary full" style="margin-top:10px">นำเข้าข้อมูลจากไฟล์</button><div class="section-title">เริ่มต้นใหม่</div><button id="reset" class="btn danger full">ลบข้อมูลทั้งหมดใน Cloud (ทุกเครื่อง)</button></div><div class="small muted">GLUR BAR · Supabase Cloud · <button class="btn secondary smallbtn" onclick="logout()">ออกจากระบบ</button></div>`);document.getElementById('backup').onclick=()=>downloadBlob(JSON.stringify({...db,exportedAt:new Date().toISOString(),app:'GLUR BAR'},null,2),`glur-bar-backup-${dateNow()}.json`,'application/json');document.getElementById('restore').onclick=()=>{const file=document.getElementById('restoreFile').files[0];if(!file){toast('เลือกไฟล์สำรองก่อน');return}const reader=new FileReader();reader.onload=()=>{try{const parsed=JSON.parse(reader.result);if(!parsed||!Array.isArray(parsed.stock)||!Array.isArray(parsed.recipes)||!Array.isArray(parsed.sales))throw Error('invalid');if(!confirm('ข้อมูลปัจจุบันจะถูกแทนที่ด้วยข้อมูลในไฟล์ ต้องการดำเนินการต่อหรือไม่?'))return;db={...blank(),...parsed};saveDB();toast('กู้คืนข้อมูลสำเร็จ');renderSettings()}catch(err){toast('ไฟล์ไม่ถูกต้องหรือไม่ใช่ไฟล์สำรอง GLUR BAR')}};reader.readAsText(file)};document.getElementById('reset').onclick=()=>{if(!confirm('ยืนยันลบข้อมูลทั้งหมด? แนะนำให้ดาวน์โหลดไฟล์สำรองก่อน'))return;if(!confirm('ยืนยันอีกครั้ง: ข้อมูลสต๊อก สูตร ยอดขาย และค่าใช้จ่ายจะถูกลบ'))return;db=blank();saveDB();toast('ล้างข้อมูลแล้ว');renderSettings()}}
function downloadBlob(content,filename,type){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
startCloud();
</script>
